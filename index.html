<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>らくがきでんごんゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#EAF4FB;
    --ink:#27324A;
    --orange:#FF8A3D; --orange-dark:#E06B1F;
    --teal:#2BB7A4; --teal-dark:#1C8C7D;
    --pink:#FF6B9D; --pink-dark:#D94C80;
    --purple:#8B6FE8; --purple-dark:#6E4FD0;
    --yellow:#FFD23F;
    --card:#FFFFFF;
    --line:#D7E6F0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    font-family:'Zen Maru Gothic', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #DDEEFB 0%, transparent 40%),
      radial-gradient(circle at 88% 92%, #FDEFE0 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
  }
  .screen{ max-width:720px; margin:0 auto; padding:24px 16px 60px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .logo{ font-family:'Mochiy Pop One', sans-serif; font-size:32px; text-align:center; line-height:1.35; color:var(--orange-dark); margin-top:10px; transform:rotate(-2deg); }
  .tagline{ text-align:center; opacity:.75; margin:10px 0 30px; font-size:15px; max-width:420px; }
  .choice-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; width:100%; }
  .big-btn{ font-family:'Zen Maru Gothic',sans-serif; font-size:18px; font-weight:700; border:none; border-radius:22px; padding:20px 22px; color:#fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.15); transition:transform .08s ease, box-shadow .08s ease; line-height:1.5; min-width:150px; }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .big-btn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:0 5px 0 rgba(0,0,0,.08); }
  .big-btn:disabled:active{ transform:none; }
  .crayon-orange{ background:var(--orange); } .crayon-orange:active{ background:var(--orange-dark); }
  .crayon-teal{ background:var(--teal); } .crayon-teal:active{ background:var(--teal-dark); }
  .crayon-pink{ background:var(--pink); } .crayon-pink:active{ background:var(--pink-dark); }
  .crayon-purple{ background:var(--purple); } .crayon-purple:active{ background:var(--purple-dark); }
  .sub{ font-size:12px; font-weight:400; opacity:.9; margin-top:4px; }
  .ticket{ background:#fff; border:3px dashed var(--orange); border-radius:18px; padding:16px 30px; text-align:center; transform:rotate(-1.5deg); box-shadow:0 4px 0 rgba(0,0,0,.07); margin-bottom:6px; }
  .ticket-label{ font-size:13px; opacity:.7; }
  .ticket-code{ font-family:'Mochiy Pop One',sans-serif; font-size:46px; letter-spacing:8px; color:var(--orange-dark); }
  .hint{ opacity:.65; font-size:13px; margin:6px 0 22px; text-align:center; }
  .player-list{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:26px; width:100%; min-height:40px; }
  .chip{ background:#fff; border-radius:999px; padding:8px 16px 8px 8px; display:flex; align-items:center; gap:8px; box-shadow:0 2px 0 rgba(0,0,0,.07); font-size:14px; font-weight:700; }
  .avatar{ width:26px;height:26px;border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:12px; flex-shrink:0; }
  .waiting-msg{ opacity:.65; }
  .lobby-note{ font-size:13px; font-weight:700; color:var(--teal-dark); opacity:0; transition:opacity .4s ease; min-height:18px; text-align:center; margin:2px 0 0; }
  .card{ background:var(--card); border-radius:20px; padding:18px; width:100%; box-shadow:0 4px 0 rgba(0,0,0,.05); margin-bottom:14px; }
  .card p{ margin:0 0 10px; }
  .form-label{ font-weight:700; font-size:14px; }
  input[type=text], textarea{ width:100%; font-family:'Zen Maru Gothic',sans-serif; font-size:18px; padding:14px; border-radius:14px; border:2px solid var(--line); resize:none; margin-top:6px; }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--orange); }
  .round-bar{ display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:12px; font-weight:700; font-size:14px; }
  .timer-pill{ background:var(--pink); color:#fff; padding:6px 14px; border-radius:999px; font-family:'Mochiy Pop One',sans-serif; font-size:13px; }
  .prompt-box{ background:#FFF7E8; border:2px dashed var(--yellow); border-radius:16px; padding:16px; text-align:center; font-size:19px; font-weight:700; margin-bottom:14px; width:100%; }
  .canvas-wrap, .preview-canvas{ width:100%; aspect-ratio:4/3; background:#fff; border-radius:16px; border:2px solid var(--line); overflow:hidden; margin-bottom:12px; }
  .canvas-wrap canvas, .preview-canvas canvas{ width:100%; height:100%; display:block; touch-action:none; }
  .turn-gate{ position:fixed; inset:0; z-index:9999; background:rgba(39,50,74,.72); display:flex; align-items:center; justify-content:center; padding:20px; animation:tgFade .25s ease; }
  .turn-gate-box{ background:#fff; border-radius:24px; padding:26px 22px; max-width:360px; width:100%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.35); border:4px solid #FF8A3D; }
  .turn-gate-bell{ font-size:54px; animation:tgRing .6s ease-in-out infinite; display:inline-block; }
  .turn-gate-title{ font-size:28px; font-weight:900; color:#E8590C; margin:6px 0 8px; }
  .turn-gate-sub{ font-size:14px; color:#4a5568; margin-bottom:16px; line-height:1.6; }
  .turn-gate-btn{ width:100%; font-size:24px; padding:18px 10px; animation:tgPulse 1s ease-in-out infinite; }
  @keyframes tgFade{ from{opacity:0} to{opacity:1} }
  @keyframes tgRing{ 0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(14deg)} }
  @keyframes tgPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .canvas-stack{ position:relative; width:100%; aspect-ratio:4/3; background:#fff; border-radius:16px; border:2px solid var(--line); overflow:hidden; margin-bottom:12px; }
  .canvas-stack canvas{ position:absolute; top:0; left:0; width:100%; height:100%; display:block; touch-action:none; }
  .mode-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .mode-btn{ flex:1; min-width:140px; font-family:'Zen Maru Gothic',sans-serif; background:#fff; border:2px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:4px; }
  .mode-btn.active{ border-color:var(--teal); background:#E7F8F5; }
  .mode-title{ font-weight:900; font-size:15px; color:var(--ink); }
  .mode-desc{ font-size:12px; opacity:.7; line-height:1.5; }
  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; width:100%; }
  .swatch{ width:32px;height:32px;border-radius:50%; border:3px solid #fff; outline:2px solid var(--line); cursor:pointer; padding:0; }
  .swatch.active{ outline:3px solid var(--ink); }
  .swatch.custom{ background:conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33); position:relative; }
  .swatch.custom.has-color::after{ content:'✎'; position:absolute; right:-4px; bottom:-6px; font-size:12px; background:#fff; border-radius:50%; width:16px; height:16px; line-height:16px; text-align:center; box-shadow:0 0 0 1px var(--line); }
  .ce-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999; display:flex; align-items:center; justify-content:center; padding:12px; }
  .ce-panel{ background:#fff; border-radius:20px; padding:16px; width:100%; max-width:420px; max-height:96vh; overflow:auto; box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .ce-title{ font-size:20px; font-weight:900; margin-bottom:10px; }
  .ce-main{ display:flex; gap:10px; align-items:stretch; }
  .ce-sv{ position:relative; flex:1; aspect-ratio:1/1; border-radius:8px; border:2px solid var(--line); touch-action:none; cursor:crosshair;
    background:linear-gradient(to bottom, rgba(255,255,255,0), #fff), linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  .ce-preview{ width:44px; border-radius:8px; border:2px solid var(--line); }
  .ce-val{ position:relative; width:26px; border-radius:13px; border:2px solid var(--line); touch-action:none; cursor:ns-resize; }
  .ce-knob{ position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:#fff; border:3px solid #222; box-shadow:0 0 0 1px #fff; pointer-events:none; }
  .ce-val .ce-knob{ left:50%; }
  .ce-sub{ font-size:14px; font-weight:700; margin:12px 0 6px; }
  .ce-basic{ display:grid; grid-template-columns:repeat(12,1fr); gap:6px; }
  .ce-basic button{ aspect-ratio:1/1; border-radius:50%; border:1px solid #999; padding:0; cursor:pointer; }
  .ce-actions{ display:flex; gap:10px; margin-top:14px; justify-content:flex-end; }
  .ce-hex{ font-size:12px; font-weight:700; opacity:.7; margin-top:8px; }
  .size-btn{ width:34px;height:34px;border-radius:50%; background:#fff; border:2px solid var(--line); cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; }
  .size-btn.active{ border-color:var(--orange); background:#FFF1E5; color:var(--orange-dark); }
  .pentype-row{ display:flex; gap:8px; flex-wrap:wrap; width:100%; margin-bottom:10px; }
  .pentype-btn{ font-family:'Zen Maru Gothic',sans-serif; background:#fff; border:2px solid var(--line); border-radius:14px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .pentype-btn.active{ border-color:var(--teal); background:#E7F8F5; color:var(--teal-dark); }
  .pentype-icon{ font-size:15px; }
  .toolbar-label{ font-size:12px; opacity:.6; font-weight:700; width:100%; margin:2px 0 -2px; }
  .tool-action{ margin-left:auto; display:flex; gap:8px; }
  .small-btn{ font-family:'Zen Maru Gothic',sans-serif; background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 16px; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); }
  .small-btn:active{ background:var(--line); }
  .spinner{ width:34px;height:34px;border:5px solid var(--line); border-top-color:var(--orange); border-radius:50%; animation:spin 1s linear infinite; margin-top:18px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .book-grid{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:20px 0; width:100%; }
  .book-btn{ min-width:150px; }
  .line-screen{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .line-header{ display:flex; align-items:center; gap:12px; width:100%; margin-bottom:14px; }
  .line-header .line-title{ font-family:'Mochiy Pop One',sans-serif; font-size:16px; color:var(--orange-dark); flex:1; }
  .line-talk-wrap{
    width:100%; border-radius:20px; padding:22px 14px; box-shadow:0 4px 0 rgba(0,0,0,.05);
    display:flex; flex-direction:column; gap:18px;
    background-color:#8FC7A6;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 26px);
  }
  .line-msg{ display:flex; align-items:flex-start; gap:8px; opacity:0; transform:translateY(14px); transition:opacity .35s ease, transform .35s ease; }
  .line-msg.show{ opacity:1; transform:translateY(0); }
  .typing-bubble{ display:flex; align-items:center; gap:4px; padding:14px 16px; }
  .typing-bubble span{ width:7px; height:7px; border-radius:50%; background:#c7c7c7; animation:line-typing-blink 1.2s infinite ease-in-out; }
  .typing-bubble span:nth-child(2){ animation-delay:.2s; }
  .typing-bubble span:nth-child(3){ animation-delay:.4s; }
  @keyframes line-typing-blink{ 0%,80%,100%{ opacity:.3; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-3px); } }
  .line-avatar{ width:36px;height:36px;border-radius:50%; display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0; box-shadow:0 2px 0 rgba(0,0,0,.15); border:2px solid rgba(255,255,255,.6); }
  .line-msg-col{ display:flex; flex-direction:column; gap:4px; max-width:74%; }
  .line-name{ font-size:11px; font-weight:700; color:#fff; opacity:.85; margin-left:3px; text-shadow:0 1px 1px rgba(0,0,0,.15); }
  .line-bubble{ position:relative; background:#fff; border-radius:4px 16px 16px 16px; padding:12px 14px; font-size:16px; font-weight:700; line-height:1.5; box-shadow:0 2px 0 rgba(0,0,0,.08); word-break:break-word; }
  .line-bubble:before{ content:''; position:absolute; top:0; left:-7px; width:0; height:0; border-style:solid; border-width:0 8px 10px 0; border-color:transparent #fff transparent transparent; }
  .line-bubble.line-empty{ opacity:.6; font-weight:400; font-style:italic; font-size:13px; }
  .line-bubble.draw{ padding:6px; border-radius:4px 16px 16px 16px; }
  .line-canvas{ width:190px; max-width:60vw; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:#fff; }
  .line-canvas canvas{ width:100%; height:100%; display:block; }
  .verdict-box{ width:100%; border-radius:16px; padding:14px; text-align:center; font-weight:700; margin-bottom:10px; border:3px solid var(--line); background:#fff; }
  .verdict-box .v-mark{ font-size:44px; line-height:1.1; }
  .verdict-box .v-text{ font-size:22px; }
  .verdict-box .v-sub{ font-size:12px; opacity:.7; margin-top:4px; }
  .verdict-box.v-correct{ background:#E8F8E0; border-color:#5BBF3A; }
  .verdict-box.v-close{ background:#FFF4D6; border-color:#F2B21B; }
  .verdict-box.v-wrong{ background:#FDE6E3; border-color:#E5604F; }
  .verdict-btns{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .replay-box{ width:100%; margin-bottom:10px; }
  .replay-label{ text-align:center; font-size:13px; font-weight:700; margin:6px 0; min-height:18px; }
  .replay-ctrl{ display:flex; gap:8px; align-items:center; }
  .replay-ctrl input[type=range]{ flex:1; }
  .bubble{ background:#FFF7E8; border:2px dashed var(--yellow); border-radius:16px; padding:22px; text-align:center; font-size:20px; font-weight:700; width:100%; margin-bottom:10px; }
  .author-tag{ text-align:center; opacity:.65; font-size:13px; margin-bottom:14px; }
  .qrbox{ background:#fff; border-radius:18px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px; box-shadow:0 4px 0 rgba(0,0,0,.05); margin-bottom:18px; }
  .qrbox img, .qrbox canvas, .qrbox table{ display:block; }
  .qrbox .qrcap{ font-size:12px; opacity:.65; }
  /* ---------- まちじかんミニゲーム ---------- */
  .mini-game{ border:3px solid #E4DBFB; margin-top:14px; width:100%; max-width:420px; background:#fff; border-radius:20px; padding:14px; box-shadow:0 4px 0 rgba(0,0,0,.05); margin-top:20px; }
  .mg-title{ font-family:'Mochiy Pop One',sans-serif; font-size:14px; color:var(--purple-dark); text-align:center; margin-bottom:10px; line-height:1.5; }
  .mg-pick{ display:flex; flex-wrap:wrap; gap:8px; }
  .mg-pick button{ flex:1 1 44%; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:13px; border:2px solid var(--line); background:#fff; border-radius:14px; padding:10px 6px; cursor:pointer; color:var(--ink); line-height:1.45; }
  .mg-pick button:active{ background:#EFF6FB; transform:translateY(2px); }
  .mg-emoji{ display:block; font-size:24px; margin-bottom:2px; }
  .mg-best{ display:block; font-size:10px; opacity:.6; font-weight:400; margin-top:2px; }
  .mg-bar{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:10px; }
  .mg-bar .mg-stat{ background:#F2F7FB; border-radius:999px; padding:5px 12px; }
  .mg-back{ font-family:'Zen Maru Gothic',sans-serif; background:#fff; border:2px solid var(--line); border-radius:12px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); flex-shrink:0; }
  .mg-back:active{ background:var(--line); }
  .mg-grid{ display:grid; gap:8px; }
  .mg-cell{ aspect-ratio:1/1; border:none; border-radius:14px; background:#F2F7FB; font-size:clamp(16px,7vw,30px); cursor:pointer; padding:0; line-height:1; display:flex; align-items:center; justify-content:center; transition:transform .08s ease, background .12s ease; }
  .mg-cell:active{ transform:scale(.92); }
  .mg-cell.hit{ background:#FFE9B8; }
  .mg-simon{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mg-simon button{ aspect-ratio:1/1; border:none; border-radius:18px; cursor:pointer; opacity:.45; transition:opacity .1s ease, transform .1s ease; }
  .mg-simon button.lit{ opacity:1; transform:scale(1.05); }
  .mg-react{ width:100%; aspect-ratio:3/2; border:none; border-radius:18px; font-family:'Mochiy Pop One',sans-serif; font-size:19px; color:#fff; cursor:pointer; line-height:1.5; padding:10px; }
  .mg-fruit-wrap{ width:100%; max-width:340px; margin:0 auto; }
  .mg-fruit-canvas{ display:block; width:100%; border-radius:14px; border:3px solid #C98A4B; background:#FFF3DC; touch-action:none; cursor:pointer; }
  .mg-fruit-legend{ display:flex; justify-content:center; flex-wrap:wrap; gap:2px; font-size:15px; margin-top:8px; opacity:.85; }
  .mg-fruit-legend span:not(:last-child)::after{ content:'›'; opacity:.4; margin:0 1px; font-size:11px; }
  .mg-msg{ text-align:center; font-size:13px; font-weight:700; min-height:20px; margin-top:10px; line-height:1.5; }
  .mg-result{ text-align:center; padding:6px 0 2px; }
  .mg-result .mg-big{ font-family:'Mochiy Pop One',sans-serif; font-size:30px; color:var(--orange-dark); line-height:1.3; }
  .mg-result .mg-sub{ font-size:13px; font-weight:700; opacity:.75; margin-top:4px; }
  .mg-again{ display:flex; gap:8px; margin-top:12px; }
  .mg-again button{ flex:1; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:14px; padding:12px 8px; cursor:pointer; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .mg-again button:active{ transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,.15); }
  .mg-again .mg-retry{ background:var(--teal); }
  .mg-again .mg-other{ background:var(--purple); }
  .mg-choices{ display:flex; gap:10px; }
  .mg-choice{ flex:1; font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:22px; border:none; border-radius:14px; padding:16px 8px; cursor:pointer; background:#F2F7FB; color:var(--ink); }
  .mg-choice:active{ background:var(--line); transform:scale(.95); }
  .mg-problem{ font-family:'Mochiy Pop One',sans-serif; font-size:28px; text-align:center; margin:8px 0 16px; color:var(--ink); }
  .mg-swatch{ width:56px; height:56px; border-radius:16px; margin:0 auto 14px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .mg-track{ position:relative; height:34px; background:#F2F7FB; border-radius:999px; margin:16px 0; overflow:hidden; }
  .mg-target{ position:absolute; top:0; bottom:0; width:16%; background:#FFD23F; }
  .mg-marker{ position:absolute; top:2px; bottom:2px; width:14px; border-radius:7px; background:var(--purple-dark); }
  .mg-stop-btn{ width:100%; font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:16px; border:none; border-radius:16px; padding:16px; cursor:pointer; color:#fff; background:var(--orange); box-shadow:0 4px 0 var(--orange-dark); }
  .mg-stop-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--orange-dark); }
  .mg-type-input{ width:100%; box-sizing:border-box; margin-top:10px; font-family:inherit; font-size:16px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; text-align:center; background:#fff; color:var(--ink); }
  .mg-belt{ position:relative; height:112px; border-radius:16px; background:linear-gradient(#FFF3DC,#FFE2B0); overflow:hidden; border-bottom:6px solid #C98A4B; }
  .mg-plate{ position:absolute; top:8px; left:100%; width:38%; text-align:center; }
  .mg-plate-sushi{ font-size:44px; line-height:1.1; }
  .mg-plate-word{ background:#fff; border-radius:999px; padding:4px 8px; font-weight:900; font-size:15px; box-shadow:0 2px 0 rgba(0,0,0,.1); margin-top:2px; white-space:nowrap; }
  .mg-roma{ text-align:center; font-family:monospace; font-size:22px; font-weight:900; letter-spacing:2px; margin-top:10px; color:#9AA7B2; min-height:30px; }
  .mg-roma .done{ color:var(--teal); }
  .mg-sky{ position:relative; height:250px; border-radius:16px; background:linear-gradient(#DDF2FF,#F4FBFF); overflow:hidden; }
  .mg-balloon{ position:absolute; display:none; min-width:76px; max-width:46%; text-align:center; padding:8px 10px; border-radius:50% 50% 46% 46% / 58% 58% 42% 42%; color:#fff; font-weight:900; line-height:1.25; box-shadow:0 3px 0 rgba(0,0,0,.12); cursor:pointer; }
  .mg-balloon.lock{ outline:3px solid #FFD23F; }
  .mg-bw{ display:block; font-size:16px; }
  .mg-br{ display:block; font-size:12px; font-family:monospace; opacity:.95; }
  .mg-br .done{ color:#FFE27A; }
  .mg-kana-big{ font-family:'Mochiy Pop One',sans-serif; font-size:72px; text-align:center; line-height:1.2; margin:4px 0 0; color:var(--ink); }
  .mg-tbox{ width:100%; }
  .mg-setup-title{ font-family:'Mochiy Pop One',sans-serif; font-size:15px; text-align:center; color:var(--purple-dark); margin-bottom:8px; }
  .mg-setgroup{ display:flex; align-items:center; gap:8px; margin:8px 0; }
  .mg-setlabel{ font-size:12px; font-weight:700; min-width:62px; }
  .mg-chips{ display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .mg-chip{ font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:12px; border:2px solid var(--line); background:#fff; border-radius:999px; padding:6px 10px; cursor:pointer; color:var(--ink); }
  .mg-chip.on{ background:var(--purple); border-color:var(--purple); color:#fff; }
  .mg-setnote{ font-size:11px; opacity:.75; line-height:1.6; margin-top:6px; text-align:center; }
  .mg-seterr{ color:#D6453D; opacity:1; font-weight:700; min-height:0; }
  .mg-songlist{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; margin:6px 0 4px; padding:2px; }
  .mg-songbtn{ display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:14px; border:2px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; cursor:pointer; color:var(--ink); }
  .mg-songbtn small{ font-weight:500; font-size:11px; opacity:.85; white-space:nowrap; }
  .mg-songbtn.on{ background:var(--purple); border-color:var(--purple); color:#fff; }
  .mg-adminbtn{ font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:11px; border:2px dashed var(--line); background:transparent; border-radius:999px; padding:5px 12px; cursor:pointer; color:var(--ink); opacity:.75; }
  .mg-input{ width:100%; box-sizing:border-box; border:2px solid var(--line); border-radius:12px; padding:9px 10px; font-family:inherit; font-size:14px; color:var(--ink); margin-bottom:8px; }
  .mg-admin-row{ display:flex; gap:6px; align-items:center; border:2px solid var(--line); border-radius:12px; padding:6px 8px; margin-bottom:6px; background:#fff; }
  .mg-admin-name{ flex:1; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mg-admin-sub{ font-size:11px; opacity:.75; margin:2px 0 6px; line-height:1.6; }
  .mg-textarea{ width:100%; box-sizing:border-box; min-height:110px; border:2px solid var(--line); border-radius:12px; padding:10px; font-family:inherit; font-size:14px; color:var(--ink); resize:vertical; }
  .mg-target-line{ font-weight:900; font-size:17px; text-align:center; margin-top:8px; line-height:1.5; min-height:4px; }
  .mg-yomi{ font-size:12px; opacity:.6; text-align:center; min-height:16px; line-height:1.5; word-break:break-all; }
  .mg-qtext{ font-family:'Mochiy Pop One',sans-serif; font-size:32px; text-align:center; line-height:1.3; margin-top:8px; color:var(--ink); word-break:break-all; }
  .mg-qtext.big{ font-size:64px; }
  .mg-qtext.small{ font-size:19px; line-height:1.5; }
  .mg-roma{ word-break:break-all; }
  .mg-roma.sm{ font-size:15px; letter-spacing:1px; }
  .mg-upper .mg-roma, .mg-upper .mg-br, .mg-upper .mg-key{ text-transform:uppercase; }
  .mg-sky.wide .mg-balloon{ max-width:88%; }
  .mg-br{ word-break:break-all; }
  .mg-kb{ display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:10px; }
  .mg-kbrow{ display:flex; gap:4px; }
  .mg-kbrow:nth-child(2){ padding-left:12px; }
  .mg-kbrow:nth-child(3){ padding-left:28px; }
  .mg-key{ width:clamp(20px,8vw,30px); height:clamp(26px,9vw,32px); border-radius:7px; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; color:var(--ink); box-shadow:0 2px 0 rgba(0,0,0,.12); }
  .mg-key.next{ outline:3px solid #FF8A3D; transform:translateY(-1px); }
  .mg-key.bad{ background:#FF6B6B !important; color:#fff; }
  .linkrow{ display:flex; gap:8px; align-items:center; }
  /* 人数まち画面: 左=部屋番号・参加者 / 右=QRコード・ミニゲーム(どちらも上からならぶ横並び) */
  .screen.lobby{ max-width:1080px; }
  .lobby-grid{ display:flex; flex-wrap:wrap; gap:12px 28px; width:100%; align-items:flex-start; justify-content:center; }
  .lobby-main{ flex:1 1 360px; min-width:0; display:flex; flex-direction:column; align-items:center; }
  .lobby-main .player-list{ margin-bottom:16px; }
  .lobby-side{ flex:0 1 420px; width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }
  .lobby-side .hint{ margin:0 0 8px; }
  .lobby-side .qrbox{ width:100%; padding:12px; margin-bottom:0; }
  .lobby-side .mini-game{ margin-top:14px; }
  .firebase-setup{ background:#fff; border:3px dashed var(--orange); border-radius:18px; padding:18px; width:100%; margin-bottom:14px; }
  .firebase-setup h3{ font-size:15px; margin:0 0 10px; color:var(--orange-dark); }
  .firebase-setup input[type=text]{ font-family:monospace; font-size:13px; }
  .error-box{ background:#FFE9E9; border:2px solid #E14B4B; border-radius:12px; padding:12px 14px; margin:10px 0; color:#B23B3B; font-size:13px; line-height:1.6; }
  .help-steps{ font-size:13px; line-height:1.85; opacity:.85; margin:0; }
  .help-steps strong{ color:var(--orange-dark); }
  .help-steps a{ color:var(--teal-dark); }
  .connecting{ text-align:center; padding:30px; opacity:.7; }
  /* 背景をただよう「いままでの絵」(うごきは JavaScript で制御) */
  #app{ position:relative; z-index:1; }
  #bgDrift{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  #bgDrift img{ position:absolute; left:0; top:0; opacity:.38; border-radius:10px; will-change:transform, opacity; user-select:none; -webkit-user-drag:none; }
  /* さわったときの エフェクト(ボタンなどの上にも出る・さわれない) */
  #bgFx{ position:fixed; inset:0; z-index:998; overflow:hidden; pointer-events:none; }
  #bgFx span{ position:absolute; left:0; top:0; white-space:nowrap; will-change:transform, opacity; }
  .bgSay{ position:absolute; left:0; top:0; background:#fff; color:#27324A; font-weight:700; font-size:12px; line-height:1.4; padding:5px 10px; border-radius:14px; box-shadow:0 3px 0 rgba(0,0,0,.12); max-width:150px; width:max-content; text-align:center; opacity:0; transition:opacity .25s ease; will-change:transform, opacity; }
  .bgBadge{ position:absolute; left:0; top:0; font-size:22px; line-height:1; will-change:transform; }
  .bgSay::after{ content:''; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-top-color:#fff; border-bottom:0; }
  .global-home-btn{ position:fixed; top:14px; left:14px; z-index:999; font-family:'Zen Maru Gothic',sans-serif; background:#fff; border:2px solid var(--line); border-radius:999px; padding:10px 16px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.08); display:none; }
  .global-home-btn:active{ background:var(--line); }
  .avatar-picker{ display:flex; gap:10px; flex-wrap:wrap; }
  .avatar-option{ width:56px;height:56px;border-radius:50%; border:3px solid #fff; outline:2px solid var(--line); background-size:cover; background-position:center; cursor:pointer; padding:0; flex-shrink:0; box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .avatar-option.active{ outline:3px solid var(--orange); }
</style>

  function findAvatar(id){

  function avatarCircleHtml(cls, avatarId, fallbackColor, fallbackInitial, extraStyle){
    var av = findAvatar(avatarId);
    var style = extraStyle || '';
    if(av){
      return '<div class="'+cls+'" style="background-image:url(\''+av.img+'\'); background-size:cover; background-position:center;'+style+'"></div>';
    }
    return '<div class="'+cls+'" style="background:'+fallbackColor+';'+style+'">'+fallbackInitial+'</div>';
  }
  function renderAvatarPicker(containerId, selectedId, onChange){
    var el = document.getElementById(containerId);
    if(!el) return;
    el.innerHTML = AVATAR_LIST.map(function(a){
      return '<button type="button" class="avatar-option'+(a.id===selectedId?' active':'')+'" data-avatar="'+a.id+'" style="background-image:url(\''+a.img+'\')" aria-label="'+esc(a.label)+'"></button>';
    }).join('');
    var btns = el.querySelectorAll('.avatar-option');
    btns.forEach(function(btn){
      btn.onclick = function(){
        btns.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        onChange(btn.getAttribute('data-avatar'));
      };
    });
  }

  async function dbGet(path){

  }

  function dbWatch(path, cb){

  }

  function esc(s){
    return String(s==null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });

  function genId(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  // ---------- canvas helpers ----------
  function prepareCanvas(canvas){
    var rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width));
    canvas.height = Math.max(1, Math.round(rect.height));
  }
  function getPenTypeDef(id){
    for(var i=0;i<PEN_TYPES.length;i++){ if(PEN_TYPES[i].id===id) return PEN_TYPES[i]; }
    return PEN_TYPES[0];
  }
  function paintStrokes(ctx, canvas, strokesArr){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!Array.isArray(strokesArr)) return;
    strokesArr.forEach(function(s){
      if(!s || !s.points || s.points.length===0) return;
      var pt = getPenTypeDef(s.penType);
      var lw = Math.max(2, s.width * (pt.widthMul||1) * Math.min(canvas.width, canvas.height));
      ctx.save();
      ctx.globalAlpha = (pt.alpha!=null ? pt.alpha : 1);
      ctx.globalCompositeOperation = pt.composite || 'source-over';
      if(s.points.length===1){
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.points[0].x*canvas.width, s.points[0].y*canvas.height, lw/2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        return;
      }
      ctx.strokeStyle = s.color; ctx.lineWidth = lw; ctx.lineCap = pt.cap || 'round'; ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x*canvas.width, s.points[0].y*canvas.height);
      for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i].x*canvas.width, s.points[i].y*canvas.height); }
      ctx.stroke();
      ctx.restore();
    });
  }

  // ---------- 背景をただよう絵(いままでの絵コレクション) ----------
  // この端末の中(localStorage)に、小さなサムネイルだけを ためる。
  // MAX_GALLERY まいをこえたら、いちばん古い絵から じゅんに きえる。
  var GALLERY_KEY = 'rakugaki_gallery_v1';
  var MAX_GALLERY = 16;         // ほぞんする さいだいまい数(1まい 数KB → ぜんぶで 100KB以下)
  var THUMB_W = 120, THUMB_H = 90;
  var bgDriftTimer = null;
  function galleryLoad(){
    try{
      var a = JSON.parse(localStorage.getItem(GALLERY_KEY) || '[]');
      return Array.isArray(a) ? a.filter(function(x){ return x && typeof x.src === 'string' && x.src.indexOf('data:image/png') === 0; }) : [];
    }catch(e){ return []; }
  }
  function gallerySig(strokesArr){
    var s = ''; try{ s = JSON.stringify(strokesArr); }catch(e){ return ''; }
    var h = 5381; for(var i=0;i<s.length;i++){ h = ((h<<5)+h + s.charCodeAt(i))|0; }
    return s.length + ':' + (h>>>0).toString(36);
  }
  function galleryAdd(strokesArr){
    try{
      if(!Array.isArray(strokesArr) || !strokesArr.length) return;
      var sig = gallerySig(strokesArr); if(!sig) return;
      var list = galleryLoad();
      for(var i=0;i<list.length;i++){ if(list[i].sig === sig) return; }   // おなじ絵は1まいだけ
      var c = document.createElement('canvas'); c.width = THUMB_W; c.height = THUMB_H;
      paintStrokes(c.getContext('2d'), c, strokesArr);
      list.push({ sig:sig, src:c.toDataURL('image/png') });
      while(list.length > MAX_GALLERY) list.shift();                       // 古いものから きえる
      localStorage.setItem(GALLERY_KEY, JSON.stringify(list));
      clearTimeout(bgDriftTimer); bgDriftTimer = setTimeout(renderBgDrift, 600);   // まとめて1回だけ作りなおす
    }catch(e){}
  }
  // ---- ただよう絵の うごき(13しゅるい) ----

  function bgActTag(A, dt, now){
    var O = A.oni, i, r, best = null, bd = 1e9;
    for(i=0;i<A.runners.length;i++){ var dd = bgDist(O, A.runners[i]); if(dd < bd){ bd = dd; best = A.runners[i]; } }
    // おにの うごき
    if(O.stunT > 0){ O.stunT -= dt; bgVel(O, 0, 0, dt, 8); }
    else if(A.t < 1.2 || !best){ bgVel(O, 0, 0, dt, 8); }
    else { bgSteer(O, best.ax, best.ay, 238, dt, 6); }
    // にげる子
    for(i=0;i<A.runners.length;i++){
      r = A.runners[i];
      var dx = r.ax - O.ax, dy = r.ay - O.ay, d = Math.sqrt(dx*dx + dy*dy) || 1, ux = dx/d, uy = dy/d;
      var sp = 268*(r.boostT > 0 ? 1.25 : 1); r.boostT -= dt;
      var vx = ux*sp, vy = uy*sp;
      var wx = r.ax < 120 ? 1 : (r.ax > bgW - 120 ? -1 : 0), wy = r.ay < 120 ? 1 : (r.ay > bgH - 120 ? -1 : 0);
      if(wx || wy){
        vx += wx*260; vy += wy*260;
        if(d < 200){   // すみに おいつめられたら よこへ すりぬける
          var px = -uy, py = ux, side = (px*(bgW/2 - r.ax) + py*(bgH/2 - r.ay)) >= 0 ? 1 : -1;
          vx += px*side*230; vy += py*side*230;
        }
      }
      if(d > 420){ vx *= 0.3; vy *= 0.3; }
      var vm = Math.sqrt(vx*vx + vy*vy); if(vm > 340){ vx *= 340/vm; vy *= 340/vm; }
      bgVel(r, vx, vy, dt, 6);
    }
    // タッチ!
    if(best && now > O.tagCd && A.t > 1.2 && bd < (O.w*0.4 + best.w*0.4)){
      var old = O, mxp = (old.px + best.px)/2, myp = (old.py + best.py)/2;
      A.oni = best; A.runners[A.runners.indexOf(best)] = old; A.badge.it = best; A.tags++;
      best.tagCd = now + 1500; best.stunT = 0.6; old.boostT = 1.2;
      fxRing(mxp, myp, '#FF6B9D', 120); fxBurst(mxp, myp, ['💥','✨'], 6, 70); fxWord(mxp, myp - 40, 'タッチ!');
      bgSay(best, 'つかまった〜!', 1400); bgSay(old, 'にげろ〜!', 1400);
    }
    if(A.t > 20){ bgSay(A.oni, 'おしまい〜!', 1800); bgActEnd(); }
  }

  function bgActRace(A, dt){
    var n = A.order.length, i, it, all;
    if(A.ph === 'line'){
      all = true;
      for(i=0;i<n;i++){ it = A.order[i]; if(bgSteer(it, A.sx, it.lane, 420, dt, 7) > 14) all = false; it.actTilt = null; }
      if(all || A.t > 4){ A.ph = 'ready'; A.rt = 0; bgSay(A.order[0], 'よーい…', 1300); }
    } else if(A.ph === 'ready'){
      A.rt += dt;
      for(i=0;i<n;i++){ it = A.order[i]; bgVel(it, 0, (it.lane - it.ay)*4, dt, 8); }
      if(A.rt > 1.3){
        A.ph = 'run'; A.runT = 0; bgSay(A.order[n-1], 'どん!', 900);
        for(i=0;i<n;i++){ it = A.order[i]; it.rs = bgRnd(200,270); it.rph = bgRnd(0,6.28); it.rfreq = bgRnd(1.2,2.4); it.bob = 5; }
      }
    } else if(A.ph === 'run'){
      A.runT += dt;
      var left = 0, rankTxt = ['','','2ばん…','3ばん…','4ばん…'];
      for(i=0;i<n;i++){
        it = A.order[i];
        if(it.finished){ bgVel(it, 0, 0, dt, 5); it.bob = 0; continue; }
        left++;
        var prog = (it.ax - A.sx)/(A.gx - A.sx);
        if(prog > 0.72 && !it.spurtChecked){ it.spurtChecked = true; it.spurt = Math.random() < 0.5; if(it.spurt) bgSay(it, 'ラストスパート!', 1000); }
        var spd = it.rs*(1 + 0.28*Math.sin(A.runT*it.rfreq + it.rph)) + (it.spurt ? 70 : 0);
        bgVel(it, spd, (it.lane - it.ay)*3, dt, 6);
        if(it.ax >= A.gx){
          it.finished = true; A.finish.push(it);
          var rk = A.finish.length;
          if(rk === 1){ fxBurst(it.px, it.py, ['🏆','🎉','✨'], 9, 90); fxWord(it.px, it.py - it.h/2, 'いっとう!'); bgSay(it, 'やったー!1ばん!', 2000); }
          else { bgSay(it, rankTxt[Math.min(rk, 4)], 1600); }
        }
      }
      if(left === 0 || A.runT > 14){
        A.ph = 'fin'; A.ft = 0;
        var last = A.finish.length ? A.finish[A.finish.length - 1] : null;
        if(last && n > 1) bgSay(last, 'くやしい〜!', 1800);
      }
    } else {
      A.ft += dt;
      for(i=0;i<n;i++){ bgVel(A.order[i], 0, 0, dt, 5); A.order[i].bob = 0; }
      if(A.ft > 2) bgActEnd();

  }

  function bgActTrain(A, dt, now){
    var L = A.order[0], i, it;
    var margin = 140, nearWall = L.ax < margin || L.ax > bgW - margin || L.ay < margin || L.ay > bgH - margin;
    A.hd += Math.sin(A.t*0.8)*1.1*dt;
    if(nearWall){
      var want = Math.atan2(bgH/2 - L.ay, bgW/2 - L.ax), diff = Math.atan2(Math.sin(want - A.hd), Math.cos(want - A.hd));
      A.hd += diff*Math.min(1, dt*2.5);
    }
    bgVel(L, Math.cos(A.hd)*155, Math.sin(A.hd)*155, dt, 6);
    for(i=1;i<A.order.length;i++){
      var f = A.order[i], tp = bgTrailPos(A.order[i-1], now, 0.7);
      bgVel(f, (tp.x - f.ax)*7, (tp.y - f.ay)*7, dt, 12);
    }
    for(i=0;i<A.order.length;i++){
      it = A.order[i]; it.trail.push({ t:now, x:it.ax, y:it.ay });
      while(it.trail.length && it.trail[0].t < now - 3000) it.trail.shift();
    }
    if(now > A.nextSay){
      A.nextSay = now + bgRnd(2500, 3500);
      var who = bgPick(A.order);
      bgSay(who, who === L ? bgPick(['ガタンゴトン','しゅっぱつ〜!','ポッポー!']) : bgPick(['ぽっぽー!','つづくよ〜','はやーい!']), 1400);
    }
    if(A.t > 15){ bgSay(L, 'とうちゃく〜!', 1800); bgActEnd(); }
  }

  // しっぽとり: みんな おしりに しっぽ(🎀)。ほかの子の しっぽを とったら ゲット、とられたら でおち
  function bgActShippo(A, dt, now){
    var M = A.members, i, j, it, o, best, bd, d, na = 0;
    for(i=0;i<M.length;i++){
      it = M[i];
      var sp = Math.sqrt(it.avx*it.avx + it.avy*it.avy);
      if(sp > 25){ var wt = Math.atan2(it.avy, it.avx), df = Math.atan2(Math.sin(wt - it.th), Math.cos(wt - it.th)); it.th += df*Math.min(1, dt*6); }
      it.tx = it.ax - Math.cos(it.th)*it.w*0.5; it.ty = it.ay - Math.sin(it.th)*it.w*0.5 + it.h*0.1;
      it.tailEl.style.transform = 'translate(' + (it.tx - 10).toFixed(1) + 'px,' + (it.ty - 10).toFixed(1) + 'px)';
    }
    if(A.ph === 'done'){
      for(i=0;i<M.length;i++) bgVel(M[i], 0, 0, dt, 6);
      A.dn += dt; if(A.dn > 2.4) bgActEnd();
      return;
    }
    for(i=0;i<M.length;i++){
      it = M[i];
      if(!it.alive){ bgVel(it, 0, 0, dt, 6); it.actTilt = 16; continue; }
      best = null; bd = 1e9;
      for(j=0;j<M.length;j++){
        o = M[j]; if(o === it || !o.alive) continue;
        d = Math.sqrt(Math.pow(o.tx - it.ax, 2) + Math.pow(o.ty - it.ay, 2));
        if(d < bd){ bd = d; best = o; }
      }
      if(!best) continue;
      bgSteer(it, best.tx, best.ty, it.rs, dt, 7);
      if(A.t > 1 && bd < it.w*0.3 + 28){
        best.alive = false; best.tailEl.style.opacity = '0'; best.opOverride = 0.3; it.caps++;
        fxBurst(best.tx, best.ty, ['🎀','✨'], 6, 60); fxWord(best.tx, best.ty - 30, 'ゲット!');
        bgSay(it, 'しっぽ ゲット!', 1300); bgSay(best, 'とられた〜!', 1400);
        it.popAmp = 0.3; it.popFreq = 16; it.popT = 0;
      }
    }
    var win = null;
    for(i=0;i<M.length;i++){ if(M[i].alive){ na++; if(!win || M[i].caps > win.caps) win = M[i]; } }
    if(na <= 1 || A.t > 20){
      A.ph = 'done'; A.dn = 0;
      if(win){ win.flash = 1; fxBurst(win.px, win.py, ['🏆','🎉','✨'], 9, 90); fxWord(win.px, win.py - win.h/2, 'かち!'); bgSay(win, na <= 1 ? 'やったー!さいごまで のこった!' : 'いちばん とったよ!', 2000); }
    }
  }

  // だるまさんが ころんだ: おには かべで かぞえて、ふりむいた ときに うごいた子は スタートへ もどる
  function bgActDaruma(A, dt, now){
    var O = A.oni, R = A.runners, i, r, d, tx = bgW/2, ty = Math.max(90, O.h*0.6);
    A.st += dt;
    if(A.ph === 'set'){
      var ok = bgSteer(O, tx, ty, 420, dt, 8) < 16; O.actTilt = 0;
      for(i=0;i<R.length;i++){ if(bgSteer(R[i], R[i].home, A.sy, 420, dt, 8) > 16) ok = false; }
      if(ok || A.st > 3.5){ A.ph = 'play'; A.sub = 'call'; A.st = 0; A.said = 0; bgSay(O, 'はじめるよ〜!', 1100); }
      return;
    }
    if(A.ph === 'done'){
      bgVel(O, 0, 0, dt, 6); O.actTilt = 0;
      for(i=0;i<R.length;i++) bgVel(R[i], 0, 0, dt, 6);
      if(A.st > 2.2) bgActEnd();
      return;
    }
    if(A.t > 38){ bgSay(O, 'じかんぎれ〜!', 1500); A.ph = 'done'; A.st = 0; return; }
    bgVel(O, (tx - O.ax)*3, (ty - O.ay)*3, dt, 8);
    var look = (A.sub === 'look');
    if(!look){
      O.actTilt = 12;
      if(A.said === 0){ A.said = 1; bgSay(O, 'だーるまさんが…', 1100); }
      else if(A.said === 1 && A.st > 1.1){ A.said = 2; bgSay(O, 'ころんだ!', 900); }
      if(A.st >= A.cl){
        A.sub = 'look'; A.st = 0; O.actTilt = 0; O.popAmp = 0.25; O.popFreq = 18; O.popT = 0; fxWord(O.px, O.py - O.h/2, '👀');
        for(i=0;i<R.length;i++){ R[i].mv = !R[i].back && Math.random() < 0.3; }
      }
    } else {
      O.actTilt = 0;
      if(A.st >= 1.3){ A.sub = 'call'; A.st = 0; A.said = 0; A.cl = bgRnd(1.8, 2.6); }
    }
    for(i=0;i<R.length;i++){
      r = R[i];
      if(r.back){ if(bgSteer(r, r.home, A.sy, 300, dt, 7) < 18) r.back = false; continue; }
      if(!look){ bgSteer(r, O.ax + (r.home - bgW/2)*0.2, O.ay + O.h*0.55, 140, dt, 5); }
      else if(r.mv && A.st < 0.6){ bgSteer(r, O.ax, O.ay + O.h*0.55, 100, dt, 5); }
      else {
        bgVel(r, 0, 0, dt, 16);
        if(r.mv){ r.mv = false; r.back = true; bgSay(r, 'あっ うごいちゃった!', 1500); fxBurst(r.px, r.py - r.h/2, ['💦'], 3, 40); }
      }
      d = bgDist(r, O);
      if(!look && d < (O.w + r.w)*0.4 + 24){
        A.ph = 'done'; A.st = 0; r.flash = 1;
        fxBurst(r.px, r.py, ['🎉','✨','🎊'], 9, 90); fxWord(r.px, r.py - r.h/2, 'タッチ!');
        bgSay(r, 'タッチ〜! やったー!', 1800); bgSay(O, 'まけた〜!', 1800);
        return;
      }
    }
  }

    } else if(A.ph === 'ready'){

      if(A.ft > 1.4){ A.ph = 'fight'; A.ft = 0; A.rr = 0; bgSay(b, 'のこった!', 1000); }

  function bgClearBubbles(){
    for(var i=0;i<bgBubbles.length;i++){ if(bgBubbles[i].el.parentNode) bgBubbles[i].el.parentNode.removeChild(bgBubbles[i].el); }
    bgBubbles = []; bgTalkBusy = false; bgActReset();
  }
  function bgPlaceBubble(b){
    var it = b.it;
    var x = Math.max(b.hw + 4, Math.min(bgW - b.hw - 4, it.px));
    var y = Math.max(b.bh + 6, it.py - it.h/2*it.ps - 10);
    b.el.style.transform = 'translate(' + (x - b.hw).toFixed(1) + 'px,' + (y - b.bh).toFixed(1) + 'px)';
  }
  function bgSay(it, text, ms){
    for(var i=bgBubbles.length-1;i>=0;i--){
      if(bgBubbles[i].it === it){ if(bgBubbles[i].el.parentNode) bgBubbles[i].el.parentNode.removeChild(bgBubbles[i].el); bgBubbles.splice(i,1); }
    }
    ms = Math.max(ms, 1400 + String(text).length*150);
    var el = document.createElement('div');
    el.className = 'bgSay'; el.textContent = text;
    bgFxLayer().appendChild(el);
    var b = { it:it, el:el, until:performance.now() + ms, hw:el.offsetWidth/2, bh:el.offsetHeight };
    bgBubbles.push(b);
    bgPlaceBubble(b);
    requestAnimationFrame(function(){ el.style.opacity = '1'; });
  }
  function bgUpdateBubbles(now){
    for(var i=bgBubbles.length-1;i>=0;i--){
      var b = bgBubbles[i];
      if(bgItems.indexOf(b.it) < 0 || now > b.until + 300){
        if(b.el.parentNode) b.el.parentNode.removeChild(b.el);
        bgBubbles.splice(i,1); continue;
      }
      if(now > b.until) b.el.style.opacity = '0';
      bgPlaceBubble(b);
    }
  }
  function bgAnyHeld(){ for(var i=0;i<bgItems.length;i++){ if(bgItems[i].held) return true; } return false; }

  function hsvToHex(h, s, v){
    h = ((h%360)+360)%360;
    var c = v*s, x = c*(1-Math.abs((h/60)%2-1)), m = v-c, r=0,g=0,b=0;
    if(h<60){ r=c; g=x; } else if(h<120){ r=x; g=c; } else if(h<180){ g=c; b=x; }
    else if(h<240){ g=x; b=c; } else if(h<300){ r=x; b=c; } else { r=c; b=x; }
    function f(n){ var t = Math.round((n+m)*255).toString(16); return t.length<2 ? '0'+t : t; }
    return '#' + (f(r)+f(g)+f(b)).toUpperCase();
  }
  function hexToHsv(hex){
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'');
    if(!m) return { h:0, s:0, v:0 };
    var r = parseInt(m[1],16)/255, g = parseInt(m[2],16)/255, b = parseInt(m[3],16)/255;
    var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, h = 0;
    if(d>0){
      if(mx===r) h = 60*(((g-b)/d)%6);
      else if(mx===g) h = 60*((b-r)/d+2);
      else h = 60*((r-g)/d+4);
    }
    if(h<0) h += 360;
    return { h:h, s: mx===0 ? 0 : d/mx, v:mx };
  }

    var sv = ov.querySelector('#ceSv'), svKnob = ov.querySelector('#ceSvKnob');
    var val = ov.querySelector('#ceVal'), valKnob = ov.querySelector('#ceValKnob');
    var pv = ov.querySelector('#cePreview'), hexEl = ov.querySelector('#ceHex');
    function update(){
      var hex = hsvToHex(hsv.h, hsv.s, hsv.v);
      pv.style.background = hex;
      hexEl.textContent = hex;
      svKnob.style.left = (hsv.h/360*100) + '%';
      svKnob.style.top = ((1-hsv.s)*100) + '%';
      val.style.background = 'linear-gradient(to bottom,' + hsvToHex(hsv.h, hsv.s, 1) + ',#000)';
      valKnob.style.top = ((1-hsv.v)*100) + '%';
    }
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    function bindDrag(el, fn){
      var down = false;
      el.addEventListener('pointerdown', function(e){ down = true; try{ el.setPointerCapture(e.pointerId); }catch(_){} fn(e, el.getBoundingClientRect()); e.preventDefault(); });
      el.addEventListener('pointermove', function(e){ if(down) fn(e, el.getBoundingClientRect()); });
      var up = function(){ down = false; };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    }
    bindDrag(sv, function(e, r){
      hsv.h = clamp01((e.clientX - r.left)/r.width) * 360;
      hsv.s = 1 - clamp01((e.clientY - r.top)/r.height);
      update();
    });
    bindDrag(val, function(e, r){
      hsv.v = 1 - clamp01((e.clientY - r.top)/r.height);
      update();
    });
    var basic = ov.querySelector('#ceBasic');
    CE_BASIC.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.style.background = c;
      b.onclick = function(){ hsv = hexToHsv(c); update(); };
      basic.appendChild(b);
    });
    function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
    ov.querySelector('#ceCancel').onclick = close;
    ov.querySelector('#ceOk').onclick = function(){ var hex = hsvToHex(hsv.h, hsv.s, hsv.v); close(); onApply(hex); };
    ov.addEventListener('pointerdown', function(e){ if(e.target===ov) close(); });
    update();
  }

  function setupDrawing(canvas){
    var ctx = canvas.getContext('2d');
    var drawingNow=false, current=null;
    function getPos(e){
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches.length) ? e.touches[0].clientY : e.clientY;
      return { x:(cx-rect.left)/rect.width, y:(cy-rect.top)/rect.height };
    }
    function start(e){
      e.preventDefault(); drawingNow=true;
      var pos=getPos(e);
      current={ color:selectedColor, width:selectedSize, penType:selectedPenType, points:[pos] };
      strokes.push(current);
      paintStrokes(ctx, canvas, strokes);
    }
    function move(e){
      if(!drawingNow) return;
      e.preventDefault();
      current.points.push(getPos(e));
      paintStrokes(ctx, canvas, strokes);
    }
    function end(){ drawingNow=false; current=null; }
    canvas.style.touchAction='none';
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
  }

      if(!el){ return; }
      if(lobbyPaused){
        var pSec = Math.max(0, Math.ceil((lobbyPauseRemainingMs||0)/1000));
        var pmm = Math.floor(pSec/60), pss = pSec%60;
        el.textContent = '⏸ 一時停止中(のこり ' + pmm + ':' + (pss<10?'0':'') + pss + ')';
        return;
      }
      var msLeft = lobbyDeadline - Date.now();
      var sLeft = Math.max(0, Math.ceil(msLeft/1000));
      var mm = Math.floor(sLeft/60), ss = sLeft%60;
      el.textContent = 'あと ' + mm + ':' + (ss<10?'0':'') + ss + ' で人数があつまらないと、へやをとじます';
    }
    tick();
    lobbyCountdownInterval = setInterval(tick, 1000);
  }
  function stopLobbyCountdown(){
    if(lobbyCountdownInterval){ clearInterval(lobbyCountdownInterval); lobbyCountdownInterval=null; }
  }
  function checkLobbyTimeout(){
    if(phase!=='lobby' || !isHost || !roomCode) return;
    if(!lastRoom || lastRoom.started || lastRoom.expired) return;
    if(lobbyPaused) return; // 一時停止中はタイムアウトさせない
    var minP = (gameMode==='chimera') ? MIN_PLAYERS_CHIMERA : MIN_PLAYERS;
    if(lobbyDeadline && Date.now() >= lobbyDeadline && lastPlayers.length < minP){
      dbUpdate(pRoom(roomCode), { expired:true });
    }
  }

  function updateLobbyPauseButton(){

  async function extendLobbyDeadline(){
    // 新しく人が入ってきたときに待機時間をのばす(ホストだけが実行・書きこみする)
    if(!isHost || !roomCode) return;
    var extendedAt = Date.now();
    if(lobbyPaused){
      lobbyPauseRemainingMs = (lobbyPauseRemainingMs||0) + LOBBY_EXTEND_SEC*1000;
      lastSeenExtendedAt = extendedAt;
      await dbUpdate(pRoom(roomCode), { lobbyPauseRemainingMs: lobbyPauseRemainingMs, lobbyExtendedAt: extendedAt });
    } else {
      var base = Math.max(lobbyDeadline||0, Date.now());
      lobbyDeadline = base + LOBBY_EXTEND_SEC*1000;
      lastSeenExtendedAt = extendedAt;
      await dbUpdate(pRoom(roomCode), { lobbyDeadline: lobbyDeadline, lobbyExtendedAt: extendedAt });
    }
    flashLobbyNote('🎉 だれかが入ったので、まつじかんがのびたよ!');
  }
  async function toggleLobbyPause(){
    if(!isHost || phase!=='lobby' || !roomCode) return;
    if(lobbyPaused){
      var newDeadline = Date.now() + (lobbyPauseRemainingMs||0);
      lobbyPaused = false;
      lobbyDeadline = newDeadline;
      await dbUpdate(pRoom(roomCode), { lobbyPaused:false, lobbyDeadline:newDeadline });
    } else {
      var remain = Math.max(0, (lobbyDeadline||0) - Date.now());
      lobbyPaused = true;
      lobbyPauseRemainingMs = remain;
      await dbUpdate(pRoom(roomCode), { lobbyPaused:true, lobbyPauseRemainingMs:remain });
    }
    updateLobbyPauseButton();
  }

  function colorForName(name){
    var s = String(name==null ? '?' : name);
    var hash = 0;
    for(var i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) | 0; }

  }

  async function tryReconnect(){
    var sess = loadSession();
    if(!sess) return false;
    renderReconnecting();
    var room = await dbGet(pRoom(sess.room));
    if(!room){ clearSession(); return false; }
    var player = await dbGet(pPlayer(sess.room, sess.id));
    if(!player){
      if(room.started){ clearSession(); return false; }
      var ok = await dbSet(pPlayer(sess.room, sess.id), { id:sess.id, name:sess.name, avatar: sess.avatar || null, joinedAt: Date.now() });
      if(!ok){ clearSession(); return false; }
    }
    myId = sess.id; myName = sess.name; myAvatar = (player && player.avatar) || sess.avatar || null; roomCode = sess.room; isHost = (room.hostId === myId);
    lastRoom = room;
    gameMode = room.mode || 'phone';
    chimeraTopic = room.topic || '';
    chimeraTopicSetterId = room.topicSetterId || null;
    lobbyDeadline = room.lobbyDeadline || 0;
    lobbyPaused = !!room.lobbyPaused;
    lobbyPauseRemainingMs = room.lobbyPauseRemainingMs || 0;
    testMode = !!room.testMode;
    testBots = room.testBots || [];
    saveSession();

    if(!room.started){
      enterLobby(room);
      return true;
    }
    if(gameMode==='chimera'){
      attachRoomListeners();
      if(room.finished){ await enterChimeraReveal(); }
      else if(!room.topic){ await enterChimeraTopicPhase(room); }
      else { await enterChimeraTurnPhase(room); }
      return true;
    }
    if(room.finished){
      phase = 'spectator';
      await enterRevealPhase();
      return true;
    }
    playerOrder = room.playerOrder || []; totalRounds = room.totalRounds || 0;
    var p = playerOrder.indexOf(myId);
    attachRoomListeners();
    if(p===-1){
      phase = 'spectator';
      renderSpectator();
      return true;
    }
    var r = room.currentRound;
    var mySub = await dbGet(pSubmit(sess.room, r, myId));
    if(mySub){
      mySubmittedRound = r;
      phase = 'waiting';
      renderWaitingScreen();
      attachWaitingSubmitsWatch(r);
    } else {
      await enterRoundPhase(room);
    }
    return true;
  }

  // ---------- game flow ----------
  async function createRoom(name, mode, turnSec, useTestMode, avatarId){
    myName = name; myId = genId(); myAvatar = findAvatar(avatarId) ? avatarId : randomAvatarId();
    gameMode = mode || 'phone';
    chimeraTopic = '';
    chimeraTopicSetterId = null;
    testMode = !!useTestMode;
    testBots = [];
    botTopicSubmitted = false;
    botTurnHandledRound = -1;
    if(gameMode==='chimera'){
      chimeraTurnSec = (CHIMERA_TURN_OPTIONS.indexOf(turnSec)!==-1) ? turnSec : 5;
    }
    var code = null;
    for(var i=0;i<6;i++){
      var candidate = genRoomCode();
      var exists = await dbGet(pRoom(candidate));
      if(!exists){ code = candidate; break; }
    }
    if(!code){ alert('もういちどやってみてね'); return; }
    roomCode = code; isHost = true;
    lobbyDeadline = Date.now() + LOBBY_TIMEOUT_SEC*1000;
    lobbyPaused = false; lobbyPauseRemainingMs = 0;
    var room = { code: code, hostId: myId, mode: gameMode, started:false, finished:false, expired:false, currentRound:0, totalRounds:0, roundStartedAt:0, roundDurationSec:(gameMode==='chimera' ? chimeraTurnSec : ROUND_SEC), playerOrder:[], lobbyDeadline: lobbyDeadline, lobbyPaused:false, lobbyPauseRemainingMs:0, testMode: testMode, testBots: [] };
    if(gameMode==='chimera'){ room.topic = ''; room.topicSetterId = ''; }
    var okRoom = await dbSet(pRoom(code), room);
    var okJoin = await dbSet(pPlayer(code, myId), { id:myId, name:myName, avatar:myAvatar, joinedAt: Date.now() });
    if(gameMode==='chimera'){ await dbSet(pChimeraStrokes(code), []); }
    if(!okRoom || !okJoin){
      alert('部屋をつくれませんでした。インターネットせつぞくをかくにんして、もういちどためしてね');
      renderHome();
      return;
    }
    if(testMode){
      var botIds = [];
      for(var bi=0; bi<TEST_BOT_NAMES.length; bi++){
        var botId = 'bot_' + genId();
        botIds.push(botId);
        await dbSet(pPlayer(code, botId), { id:botId, name:TEST_BOT_NAMES[bi], avatar:randomAvatarId(), joinedAt: Date.now()+bi+1, isBot:true });
      }
      testBots = botIds;
      await dbUpdate(pRoom(code), { testBots: botIds });
    }
    saveSession();
    enterLobby(room);
  }

  async function joinRoom(code, name, avatarId){
    var room = await dbGet(pRoom(code));
    if(!room){ alert('部屋が見つかりませんでした。番号をかくにんしてね'); return; }
    if(room.started){ alert('このゲームはもうはじまっています'); return; }
    gameMode = room.mode || 'phone';
    chimeraTopic = room.topic || '';
    chimeraTopicSetterId = room.topicSetterId || null;
    lobbyDeadline = room.lobbyDeadline || 0;
    lobbyPaused = !!room.lobbyPaused;
    lobbyPauseRemainingMs = room.lobbyPauseRemainingMs || 0;
    testMode = !!room.testMode;
    testBots = room.testBots || [];
    myName = name; myId = genId(); myAvatar = findAvatar(avatarId) ? avatarId : randomAvatarId(); roomCode = code; isHost = false;
    var ok = await dbSet(pPlayer(code, myId), { id:myId, name:myName, avatar:myAvatar, joinedAt: Date.now() });
    if(!ok){
      alert('部屋に入れませんでした。インターネットせつぞくをかくにんして、もういちどためしてね');
      roomCode = null;
      return;
    }
    saveSession();
    enterLobby(room);
  }

  function attachRoomListeners(){
    detachListeners();
    roomUnsub = dbWatch(pRoom(roomCode), handleRoomUpdate);
    playersUnsub = dbWatch(pPlayers(roomCode), handlePlayersUpdate);
  }

  function enterLobby(initialRoom){
    phase = 'lobby';
    lobbyKnownPlayerIds = null;
    lastSeenExtendedAt = (initialRoom && initialRoom.lobbyExtendedAt) || 0;
    attachRoomListeners();
    renderLobby();
    if(isHost){
      if(lobbyHostCheckInterval){ clearInterval(lobbyHostCheckInterval); }
      lobbyHostCheckInterval = setInterval(checkLobbyTimeout, 2000);
    }
  }

  function handlePlayersUpdate(playersObj){
    var players = playersObj ? Object.keys(playersObj).map(function(k){ return playersObj[k]; }) : [];
    players.sort(function(a,b){ return (a.joinedAt||0) - (b.joinedAt||0); });
    lastPlayers = players;
    if(phase==='lobby'){
      updatePlayerListUI(players);
      if(isHost){
        var btn = document.getElementById('btnStart');
        var minP = (gameMode==='chimera') ? MIN_PLAYERS_CHIMERA : MIN_PLAYERS;
        if(btn) btn.disabled = players.length < minP;
        // 新しく入ってきた人を検知したら、待機時間をのばす
        if(lobbyKnownPlayerIds===null){
          lobbyKnownPlayerIds = {};
          players.forEach(function(p){ lobbyKnownPlayerIds[p.id]=true; });
        } else {
          var hasNewJoiner = false;
          players.forEach(function(p){
            if(!lobbyKnownPlayerIds[p.id]){ hasNewJoiner = true; lobbyKnownPlayerIds[p.id]=true; }
          });
          if(hasNewJoiner && !(lastRoom && (lastRoom.started || lastRoom.expired))){
            extendLobbyDeadline();
          }
        }
      }
    }
  }

  function handleRoomUpdate(room){
    if(!room) return;
    lastRoom = room;
    gameMode = room.mode || 'phone';
    if(room.topic!=null){ chimeraTopic = room.topic; }
    if(room.lobbyDeadline){ lobbyDeadline = room.lobbyDeadline; }
    if(room.lobbyPaused !== undefined){ lobbyPaused = !!room.lobbyPaused; }
    if(room.lobbyPauseRemainingMs !== undefined){ lobbyPauseRemainingMs = room.lobbyPauseRemainingMs; }
    testMode = !!room.testMode;
    if(room.testBots){ testBots = room.testBots; }
    if(room.currentRound !== advancingRound){ advancingRound = -1; }
    if(phase==='lobby'){
      if(room.lobbyExtendedAt && room.lobbyExtendedAt !== lastSeenExtendedAt){
        lastSeenExtendedAt = room.lobbyExtendedAt;
        flashLobbyNote('🎉 だれかが入ったので、まつじかんがのびたよ!');
      }
      updateLobbyPauseButton();
      if(room.expired){ forceExitExpiredRoom(); return; }
      if(room.started){
        if(gameMode==='chimera'){
          if(!room.topic){ enterChimeraTopicPhase(room); } else { enterChimeraTurnPhase(room); }
        } else { enterRoundPhase(room); }
      }
      return;
    }
    if(phase==='waiting'){
      if(room.finished){ enterRevealPhase(); return; }
      if(room.currentRound > mySubmittedRound){ enterRoundPhase(room); }
      return;
    }
    if(phase==='spectator'){
      if(room.finished){ enterRevealPhase(); }
      return;
    }
    if(phase==='chimera-topic-wait' || phase==='chimera-topic-input'){
      if(room.topic){ enterChimeraTurnPhase(room); }
      return;
    }
    if(phase==='chimera-turn' || phase==='chimera-watch' || phase==='chimera-submitted' || phase==='chimera-guess'){
      if(room.finished){ enterChimeraReveal(); return; }
      if(room.currentRound !== currentRoundSeen){ enterChimeraTurnPhase(room); }
      return;
    }
  }

  async function startGame(){
    var players = lastPlayers || [];
    var minP = (gameMode==='chimera') ? MIN_PLAYERS_CHIMERA : MIN_PLAYERS;
    if(players.length < minP){ alert('さんかしゃが' + minP + '人にたりません。もうすこしまってね'); return; }
    var order = shuffle(players.map(function(p){ return p.id; }));
    var updateObj = { started:true, currentRound:0, totalRounds: order.length, roundStartedAt: Date.now(), roundDurationSec: (gameMode==='chimera' ? chimeraTurnSec : ROUND_SEC), playerOrder: order };
    if(gameMode==='chimera'){
      // さいごの人(お題をあてる人)いがいから、ランダムでお題を決める人をえらぶ
      var guesserId = order[order.length-1];
      var candidates = order.filter(function(id){ return id !== guesserId; });
      var topicSetterId = candidates[Math.floor(Math.random()*candidates.length)];
      updateObj.topicSetterId = topicSetterId;
      updateObj.topic = '';
    }
    var ok = await dbUpdate(pRoom(roomCode), updateObj);
    if(!ok){ alert('スタートできませんでした。もういちどためしてね'); }
  }

  async function enterRoundPhase(room){
    playerOrder = room.playerOrder; totalRounds = room.totalRounds;
    var r = room.currentRound;
    var p = playerOrder.indexOf(myId);
    if(p===-1){ phase='spectator'; renderSpectator(); return; }
    myBookIndex = ((p - r) % totalRounds + totalRounds) % totalRounds;
    var prevType=null, prevContent=null;
    roundFirstTopic = '';
    if(r>0){
      var prevEntry = await dbGet(pEntry(roomCode, myBookIndex, r-1));
      if(prevEntry){ prevType = prevEntry.type; prevContent = prevEntry.content; }
      // まえの人が絵もお題あても「無回答」だったら、さいしょのお題を見せる
      if(isBlankEntry(prevEntry)){
        prevContent = null;
        if(r>1){
          var firstEntry = await dbGet(pEntry(roomCode, myBookIndex, 0));
          if(firstEntry && firstEntry.type==='write' && !isBlankEntry(firstEntry)){ roundFirstTopic = firstEntry.content; }
        }
      }
    }
    var myType = (r % 2 === 0) ? 'write' : 'draw';
    roundDeadline = room.roundStartedAt + room.roundDurationSec*1000;
    currentRoundSeen = r;
    phase = 'round';
    renderRoundScreen(r, totalRounds, myType, prevType, prevContent);
    startCountdown();
  }

  async function submitWrite(text){
    if(phase!=='round') return;
    var t = (text||'').trim();
    if(!t) t = BLANK_WRITE_TEXT;
    t = t.slice(0,40);
    await writeEntryAndSubmit({ type:'write', authorId:myId, authorName:myName, authorAvatar:myAvatar, content:t });
  }

  async function submitDraw(){
    if(phase!=='round') return;
    galleryAdd(strokes);
    await writeEntryAndSubmit({ type:'draw', authorId:myId, authorName:myName, authorAvatar:myAvatar, content: strokes });
  }

  async function writeEntryAndSubmit(entry){
    if(phase!=='round') return;
    stopCountdown();
    phase = 'submitting';
    await dbSet(pEntry(roomCode, myBookIndex, currentRoundSeen), entry);
    await dbSet(pSubmit(roomCode, currentRoundSeen, myId), true);
    mySubmittedRound = currentRoundSeen;
    if(isHost && testMode && testBots.length){
      await submitBotEntriesForRound(currentRoundSeen);
    }
    phase = 'waiting';
    renderWaitingScreen();
    attachWaitingSubmitsWatch(currentRoundSeen);
    // 自分の送信が遅れている間に、ほかの人の進行でラウンドがすでに
    // 先に進んでいた場合はすぐに追いつく(取り残されて待機画面のまま
    // 固まってしまうのを防ぐ)
    if(lastRoom && lastRoom.currentRound > mySubmittedRound){
      if(lastRoom.finished){ enterRevealPhase(); }
      else { enterRoundPhase(lastRoom); }
    }
  }

  // テスト・デバッグモード用: ボットぶんの回答をじどうで作って送信する
  // (ボットには本物のブラウザがないので、ホストがかわりに送信する)
  async function submitBotEntriesForRound(round){
    var botType = (round % 2 === 0) ? 'write' : 'draw';
    for(var i=0;i<testBots.length;i++){
      var botId = testBots[i];
      var p = playerOrder.indexOf(botId);
      if(p===-1) continue;
      var botBookIndex = ((p - round) % totalRounds + totalRounds) % totalRounds;
      var botName = 'テストボット';
      for(var j=0;j<lastPlayers.length;j++){ if(lastPlayers[j].id===botId){ botName = lastPlayers[j].name; break; } }
      var entry = (botType==='write')
        ? { type:'write', authorId:botId, authorName:botName, content: randomTestWriteContent() }
        : { type:'draw', authorId:botId, authorName:botName, content: randomTestStrokes() };
      await dbSet(pEntry(roomCode, botBookIndex, round), entry);
      await dbSet(pSubmit(roomCode, round, botId), true);
    }
  }

  function attachWaitingSubmitsWatch(round){
    if(waitingSubmitsUnsub){ waitingSubmitsUnsub(); waitingSubmitsUnsub=null; }
    waitingSubmitsUnsub = dbWatch(pSubmits(roomCode, round), function(submitsObj){
      var count = submitsObj ? Object.keys(submitsObj).length : 0;
      if(phase==='waiting'){
        var el = document.getElementById('submitCount');
        if(el) el.textContent = count + ' / ' + playerOrder.length + ' 人がだしたよ';
      }
      if(isHost){ maybeAdvanceRound(round, count); }
    });
    if(isHost){
      if(hostTimeUpInterval){ clearInterval(hostTimeUpInterval); }
      hostTimeUpInterval = setInterval(async function(){
        if(!isHost || !roomCode || !lastRoom || lastRoom.finished) return;
        var curRound = lastRoom.currentRound;
        var submitsObj = await dbGet(pSubmits(roomCode, curRound));
        var count = submitsObj ? Object.keys(submitsObj).length : 0;
        maybeAdvanceRound(curRound, count);
      }, 2000);
    }
  }

  async function maybeAdvanceRound(round, submittedCount){
    if(!isHost) return;
    if(!lastRoom || lastRoom.finished) return;
    if(round !== lastRoom.currentRound) return;
    if(advancingRound === round) return;
    var allSubmitted = submittedCount >= (lastRoom.playerOrder ? lastRoom.playerOrder.length : 0);
    var timeUp = Date.now() >= lastRoom.roundStartedAt + lastRoom.roundDurationSec*1000 + 2500;
    if(allSubmitted || timeUp){
      advancingRound = round;
      var nextRound = round + 1;
      if(nextRound >= lastRoom.totalRounds){
        await dbUpdate(pRoom(roomCode), { finished:true });
      } else {
        await dbUpdate(pRoom(roomCode), { currentRound: nextRound, roundStartedAt: Date.now() });
      }
    }
  }

  function startCountdown(){
    stopCountdown();
    function tick(){
      var msLeft = roundDeadline - Date.now();
      var secLeft = Math.max(0, Math.ceil(msLeft/1000));
      var el = document.getElementById('timerText');
      if(el) el.textContent = secLeft + 'びょう';
      if(secLeft<=0){ stopCountdown(); handleTimeUp(); }
    }
    tick();
    timerInterval = setInterval(tick, 500);
  }
  function stopCountdown(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  }
  // スマホがバックグラウンドになるとsetIntervalが止まることがあるため、
  // 画面がふたたび表示されたタイミングでも時間切れになっていないか確認する
  function recheckTimeoutIfDue(){
    if(!roundDeadline) return;
    if((phase==='round' || phase==='chimera-turn' || phase==='chimera-guess') && Date.now() >= roundDeadline){
      stopCountdown();
      handleTimeUp();
    }
  }
  function handleTimeUp(){
    if(phase==='round'){
      var myType = (currentRoundSeen % 2 === 0) ? 'write' : 'draw';
      if(myType==='write'){
        var val = currentInputEl ? currentInputEl.value : '';
        submitWrite(val);
      } else {
        submitDraw();
      }
      return;
    }
    if(phase==='chimera-turn'){
      submitChimeraTurn();
      return;
    }
    if(phase==='chimera-guess'){
      var guessVal = currentInputEl ? currentInputEl.value : '';
      submitChimeraGuess(guessVal);
      return;
    }
    // chimera-watch: 何もしない。手番の人からのルーム更新をまつ
  }

  // ---------- chimera mode ----------
  async function enterChimeraTopicPhase(room){
    playerOrder = room.playerOrder || []; totalRounds = room.totalRounds || 0;
    chimeraTopicSetterId = room.topicSetterId || null;
    stopCountdown();
    if(chimeraTopicSetterId === myId){
      phase = 'chimera-topic-input';
      renderChimeraTopicInputScreen();
    } else {
      phase = 'chimera-topic-wait';
      var setterPlayer = null;
      for(var i=0;i<lastPlayers.length;i++){ if(lastPlayers[i].id===chimeraTopicSetterId){ setterPlayer=lastPlayers[i]; break; } }
      renderChimeraTopicWaitScreen(setterPlayer ? setterPlayer.name : 'だれか');
      maybeSimulateBotTopic(room);
    }
  }

  // テスト・デバッグモード用: お題係にえらばれたのがボットだったら、かわりにお題をきめてあげる
  async function maybeSimulateBotTopic(room){
    if(!(testMode && isHost)) return;
    if(!chimeraTopicSetterId || !isTestBot(chimeraTopicSetterId)) return;
    if(room && room.topic) return;
    if(botTopicSubmitted) return;
    botTopicSubmitted = true;
    await sleep(700);
    var fresh = await dbGet(pRoom(roomCode));
    if(!fresh || fresh.topic) return;
    var t = randomTestWriteContent();
    await dbUpdate(pRoom(roomCode), { topic: t, roundStartedAt: Date.now() });
  }

  function renderChimeraTopicInputScreen(){
    appEl.innerHTML =
      '<div class="screen form">' +
        '<div class="logo" style="font-size:22px;">おだいをきめてね</div>' +
        '<p class="hint">ランダムであなたがえらばれたよ!このおだいは、さいごに絵を見てあてる人いがいの<br>みんなに見えるようになるよ</p>' +
        '<div class="card">' +
          '<p class="form-label">おだい</p>' +
          '<div class="choice-row" style="justify-content:flex-start; margin-bottom:10px;">' +
            '<button type="button" id="topicRandomBtn2" class="small-btn">🎲 ランダムでおまかせ</button>' +
          '</div>' +
          '<input type="text" id="topicInput2" maxlength="30" placeholder="例: うちゅうじんとおどるネコ">' +
        '</div>' +

    document.getElementById('topicSubmitBtn').onclick = function(){ submitChimeraTopic(input.value); };

  async function submitChimeraTopic(text){
    if(phase!=='chimera-topic-input') return;
    var t = (text||'').trim();
    if(!t){ t = pickFunnyExamples(1)[0]; }
    t = t.slice(0,30);
    chimeraTopic = t;
    appEl.innerHTML =
      '<div class="screen wait">' +
        '<div class="logo" style="font-size:22px;">けっていしたよ!</div>' +

        '<div class="spinner"></div>' +
      '</div>';
    await dbUpdate(pRoom(roomCode), { topic: t, roundStartedAt: Date.now() });
  }

  function renderChimeraTopicWaitScreen(setterName){
    appEl.innerHTML =
      '<div class="screen wait">' +
        '<div class="logo" style="font-size:22px;">おだいをきめているよ</div>' +
        '<p class="hint">' + esc(setterName) + 'さんがおだいをかんがえているよ…すこしまってね</p>' +
        '<div class="spinner"></div>' +
        miniGameHtml() +
      '</div>';
    mgInit();
  }

  async function enterChimeraTurnPhase(room){
    removeTurnGate();
    playerOrder = room.playerOrder; totalRounds = room.totalRounds;
    if(room.topic!=null){ chimeraTopic = room.topic; }
    var r = room.currentRound;
    currentRoundSeen = r;
    var activeId = playerOrder[r];
    var isLastTurn = (r === totalRounds - 1);
    // さいごの「お題あて」だけは、通常の手番時間(3/5/10びょう)ではなく
    // 固定で1分間(CHIMERA_GUESS_SEC)の回答時間にする
    var turnDurationSec = isLastTurn ? CHIMERA_GUESS_SEC : room.roundDurationSec;
    roundDeadline = room.roundStartedAt + turnDurationSec*1000;

    var locked = await dbGet(pChimeraStrokes(roomCode));
    chimeraLockedStrokes = locked || [];
    strokes = [];

    var guesserId = playerOrder[totalRounds-1];

    if(activeId === myId){
      if(isLastTurn){
        phase = 'chimera-guess';
        renderChimeraGuessScreen(r, totalRounds);
      } else {
        phase = 'chimera-turn';
        renderChimeraTurnScreen(r, totalRounds);
      }
      showMyTurnGate(isLastTurn, turnDurationSec);
    } else {
      phase = 'chimera-watch';
      var activePlayer = null;
      for(var i=0;i<lastPlayers.length;i++){ if(lastPlayers[i].id===activeId){ activePlayer=lastPlayers[i]; break; } }
      var hideTopicForMe = (myId === guesserId);
      renderChimeraWatchScreen(r, totalRounds, activePlayer ? activePlayer.name : 'だれか', isLastTurn, hideTopicForMe);
      startCountdown();
      maybeSimulateBotTurn(r, activeId, isLastTurn);
    }
  }

  // 自分の番が来たことを大きくお知らせして、スタートボタンをおしてからはじめる
  var origTitle = document.title;
  function myTurnNotify(){
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,300]); }catch(e){}
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        var ac = new AC();
        [660,880,1100].forEach(function(f,i){
          var o = ac.createOscillator(), g = ac.createGain();
          o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
          var t0 = ac.currentTime + i*0.15;
          g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);
          o.start(t0); o.stop(t0+0.16);
        });
        setTimeout(function(){ try{ ac.close(); }catch(e){} }, 800);
      }
    }catch(e){}
    try{ document.title = '🔔 あなたのばんだよ!'; }catch(e){}
  }
  function showMyTurnGate(isGuess, durationSec){
    stopCountdown();
    roundDeadline = 0; // スタートをおすまで時間はすすまない
    var te = document.getElementById('timerText');
    if(te) te.textContent = durationSec + 'びょう';
    var old = document.getElementById('turnGate'); if(old) old.remove();
    var gate = document.createElement('div');
    gate.id = 'turnGate'; gate.className = 'turn-gate';
    gate.innerHTML =
      '<div class="turn-gate-box">' +
        '<div class="turn-gate-bell">🔔</div>' +
        '<div class="turn-gate-title">あなたのばんだよ!</div>' +
        '<div class="turn-gate-sub">' + (isGuess ? 'おだいをあてるじゅんびはいいかな?' : 'じゅんびができたらスタートをおしてね') + '<br>(おしたらすぐ ' + durationSec + 'びょうのカウントがはじまるよ)</div>' +
        '<button id="turnGateStart" class="big-btn crayon-orange turn-gate-btn">スタート!</button>' +
      '</div>';
    document.body.appendChild(gate);
    myTurnNotify();
    document.getElementById('turnGateStart').onclick = function(){
      gate.remove();
      try{ document.title = origTitle; }catch(e){}
      roundDeadline = Date.now() + durationSec*1000;
      startCountdown();
      var gi = document.getElementById('guessInput');
      if(gi){ try{ gi.focus(); }catch(e){} }
    };
  }
  function removeTurnGate(){
    var g = document.getElementById('turnGate'); if(g) g.remove();
    try{ document.title = origTitle; }catch(e){}
  }

  // テスト・デバッグモード用: いまの手番がボットだったら、かわりに絵を足す/お題をあてる
  async function maybeSimulateBotTurn(r, activeId, isLastTurn){
    if(!(testMode && isHost)) return;
    if(!isTestBot(activeId)) return;
    if(botTurnHandledRound === r) return;
    botTurnHandledRound = r;
    await sleep(700 + Math.random()*500);
    var fresh = await dbGet(pRoom(roomCode));
    if(!fresh || fresh.finished || fresh.currentRound !== r) return;
    var botName = 'テストボット';

  // ---------- 正誤判定 ----------
  function normalizeAnswer(str){
    var t = String(str||'').normalize('NFKC').toLowerCase();
    // カタカナ → ひらがな
    t = t.replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
    // 記号・空白を除去
    t = t.replace(/[\s　「」『』()()\[\]【】!?!?。、,.・~〜ー\-_"'’“”…]/g, '');
    // 文末の言い回しを除去
    t = t.replace(/(だとおもう|だとおもいます|かな|だよ|です|でしょう|だね|だ)+$/,'');
    return t;
  }
  function bigrams(t){
    var a = [];
    for(var i=0;i<t.length-1;i++) a.push(t.substr(i,2));
    return a;
  }
  function judgeChimera(guess, topic){
    var g = normalizeAnswer(guess), t = normalizeAnswer(topic);
    if(!g || !t) return 'wrong';
    if(g===t) return 'correct';
    if(g.length>=2 && t.length>=2 && (g.indexOf(t)>=0 || t.indexOf(g)>=0)) return 'close';
    var a = bigrams(g), b = bigrams(t);
    if(a.length && b.length){
      var used = {}, hit = 0;
      b.forEach(function(x){ used[x] = (used[x]||0)+1; });
      a.forEach(function(x){ if(used[x]>0){ used[x]--; hit++; } });
      var dice = 2*hit/(a.length+b.length);
      if(dice>=0.6) return 'close';
    }
    return 'wrong';
  }
  var VERDICT_DEF = {
    correct:{ cls:'v-correct', mark:'⭕', text:'せいかい!' },
    close:  { cls:'v-close',   mark:'🔺', text:'おしい!' },
    wrong:  { cls:'v-wrong',   mark:'❌', text:'ざんねん…' }
  };
  function currentVerdict(room){
    var ov = room && room.chimeraVerdict;
    if(ov && VERDICT_DEF[ov]) return { key:ov, manual:true };
    var guess = room && room.chimeraGuess ? room.chimeraGuess : '';
    return { key: judgeChimera(guess, chimeraTopic), manual:false };
  }
  function updateVerdictBox(room){
    var box = document.getElementById('verdictBox');
    if(!box) return;
    var v = currentVerdict(room), d = VERDICT_DEF[v.key];
    box.className = 'verdict-box ' + d.cls;
    var isSetter = (chimeraTopicSetterId && chimeraTopicSetterId===myId);
    box.innerHTML =
      '<div class="v-mark">' + d.mark + '</div>' +
      '<div class="v-text">' + d.text + '</div>' +
      '<div class="v-sub">' + (v.manual ? 'おだいをきめた人のはんてい' : 'じどうはんてい') + '</div>' +
      (isSetter ? '<div class="v-sub">おだいをきめた人はジャッジをかえられるよ</div>' +
        '<div class="verdict-btns">' +
          '<button class="small-btn" data-v="correct">⭕ せいかい</button>' +
          '<button class="small-btn" data-v="close">🔺 おしい</button>' +
          '<button class="small-btn" data-v="wrong">❌ ざんねん</button>' +
        '</div>' : '');
    if(isSetter){
      var btns = box.querySelectorAll('button[data-v]');

        btns[i].onclick = (function(b){ return function(){

  // ---------- 絵のできるまでリプレイ ----------
  function buildReplayTimeline(finalStrokes){
    var items = [], t = 0, lastTurn = null;
    var valid = (finalStrokes||[]).filter(function(s){ return s && s.points && s.points.length>0; });
    valid.forEach(function(s, idx){
      var key = (s.turn!=null) ? s.turn : 'x';
      if(lastTurn!==null && key!==lastTurn) t += 450; // ターンの切れ目で少し間をおく
      lastTurn = key;
      var dur = Math.max(220, Math.min(900, s.points.length*14));
      items.push({ s:s, start:t, dur:dur, turn:(s.turn!=null ? s.turn : null), by:s.by||'' });
      t += dur;
    });
    return { items:items, total:t };
  }
  function paintReplayAt(canvas, tl, tm){
    var done = [], partial = null;
    for(var i=0;i<tl.items.length;i++){
      var it = tl.items[i];
      if(tm >= it.start + it.dur){ done.push(it.s); continue; }
      if(tm > it.start){
        var f = (tm - it.start)/it.dur;
        var n = it.s.points.length;
        var k = Math.max(n>1 ? 2 : 1, Math.ceil(n*f));
        var c = {}; for(var key in it.s){ c[key] = it.s[key]; }
        c.points = it.s.points.slice(0, k);
        partial = c;
      }
      break;
    }
    if(partial) done.push(partial);
    paintStrokes(canvas.getContext('2d'), canvas, done);
  }
  function setupReplay(canvas, finalStrokes){
    var tl = buildReplayTimeline(finalStrokes);
    var btnPlay = document.getElementById('replayPlay');
    var btnRestart = document.getElementById('replayRestart');
    var slider = document.getElementById('replaySeek');
    var label = document.getElementById('replayLabel');
    var tm = 0, playing = false, lastTs = 0;
    slider.max = String(Math.max(1, Math.round(tl.total)));
    function labelAt(t){
      var cur = null;
      for(var i=0;i<tl.items.length;i++){ if(tl.items[i].start <= t) cur = tl.items[i]; else break; }
      if(!cur) return 'まっしろなキャンバスから…';
      if(t >= tl.total) return 'かんせい!';
      return (cur.turn!=null ? (cur.turn+1) + '人め' : '') + (cur.by ? ': ' + cur.by + 'さん' : '');
    }
    function draw(){
      paintReplayAt(canvas, tl, tm);
      slider.value = String(Math.round(tm));
      label.textContent = labelAt(tm);
      btnPlay.textContent = playing ? '⏸ とめる' : '▶ さいせい';
    }
    function frame(ts){
      if(!playing) return;
      if(!lastTs) lastTs = ts;
      tm += (ts - lastTs); lastTs = ts;
      if(tm >= tl.total){ tm = tl.total; playing = false; draw(); replayRaf = null; return; }
      draw();
      replayRaf = requestAnimationFrame(frame);
    }
    function play(){
      if(tl.total<=0) return;
      if(tm >= tl.total) tm = 0;
      playing = true; lastTs = 0;
      if(replayRaf) cancelAnimationFrame(replayRaf);
      replayRaf = requestAnimationFrame(frame);
      draw();
    }
    function pause(){ playing = false; if(replayRaf){ cancelAnimationFrame(replayRaf); replayRaf = null; } draw(); }
    btnPlay.onclick = function(){ if(playing) pause(); else play(); };
    btnRestart.onclick = function(){ tm = 0; play(); };
    slider.oninput = function(){ playing = false; if(replayRaf){ cancelAnimationFrame(replayRaf); replayRaf=null; } tm = Number(slider.value)||0; draw(); };
    if(tl.total<=0){ btnPlay.disabled = true; btnRestart.disabled = true; slider.disabled = true; }
    tm = 0; draw();
    play(); // 画面が開いたら自動で再生
  }
