  function mgArea(){ return document.getElementById('mgArea'); }

  // 画面が入れかわった(=mgAreaが消えた)ら、ゲームのループは自動で止まる
  function mgAlive(tok){ return tok === mgToken && !!mgArea(); }

  function mgStop(){
    mgToken++;
    mgKeyFn = null;
    if(mgAudio){ try{ mgAudio.pause(); }catch(e){} mgAudio = null; }
    for(var i=0;i<mgTimers.length;i++){
      clearTimeout(mgTimers[i]); clearInterval(mgTimers[i]);
    }
    mgTimers = [];
  }
  function mgTimeout(fn, ms){
    var tok = mgToken;
    var id = setTimeout(function(){ if(mgAlive(tok)) fn(); }, ms);
    mgTimers.push(id); return id;
  }
  function mgInterval(fn, ms){
    var tok = mgToken;
    var id = setInterval(function(){
      if(!mgAlive(tok)){ clearInterval(id); return; }
      fn();
    }, ms);
    mgTimers.push(id); return id;
  }

  function mgAllBest(){
    try{ return JSON.parse(localStorage.getItem(MG_BEST_KEY) || '{}') || {}; }catch(e){ return {}; }

    return (typeof v === 'number') ? v : null;

  // あたらしい記録ならほぞんして true をかえす
  function mgSaveBest(id, score, lower){
    var best = mgGetBest(id);
    var isNew = (best === null) || (lower ? score < best : score > best);
    if(isNew){
      try{
        var all = mgAllBest();
        all[id] = score;
        localStorage.setItem(MG_BEST_KEY, JSON.stringify(all));
      }catch(e){}
    }
    return isNew;
  }

    var btns = el.querySelectorAll('[data-mg]');
    for(var j=0;j<btns.length;j++){
      (function(btn){
        btn.onclick = function(){ mgStart(btn.getAttribute('data-mg')); };
      })(btns[j]);
    }

  function mgBarHtml(statId, statText, label){
    return '<div class="mg-bar">' +
             '<span class="mg-stat" id="' + statId + '">' + esc(statText) + '</span>' +
             '<span class="mg-stat" id="mgStat2">' + esc(label) + '</span>' +
             '<button class="mg-back" id="mgBackBtn">やめる</button>' +
           '</div>';
  }
  function mgWireBack(){
    var b = document.getElementById('mgBackBtn');
    if(b) b.onclick = mgShowMenu;
  }

  function mgStart(id){
    mgStop();
    if(id==='mole') mgPlayMole();
    else if(id==='simon') mgPlaySimon();
    else if(id==='react') mgPlayReact();
    else if(id==='odd') mgPlayOdd();
    else if(id==='color') mgPlayColor();
    else if(id==='calc') mgPlayCalc();
    else if(id==='fruit') mgPlayFruit();
    else if(id==='memory') mgPlayMemory();
    else if(id==='tapnum') mgPlayTapNum();
    else if(id==='janken') mgPlayJanken();
    else if(id==='bigger') mgPlayBigger();
    else if(id==='count') mgPlayCount();
    else if(id==='dodge') mgPlayDodge();
    else if(id==='tetris') mgPlayTetris();
    else if(id==='puyo') mgPlayPuyo();
    else if(id==='hitblow') mgPlayHitBlow();
    else if(id==='culprit') mgPlayCulprit();
    else if(id==='sushi' || id==='pop' || id==='kana' || id==='song') mgLaunchTyping(id);
    else mgPlayStop();
  }

  function mgFinish(id, score, extraMsg, opt){
    mgStop();
    var el = mgArea();
    if(!el) return;
    var g = mgGameDef(id);
    var bestKey = (opt && opt.bestKey) || id;
    var isNew = mgSaveBest(bestKey, score, g.lower);
    var best = mgGetBest(bestKey);
    el.innerHTML =
      '<div class="mg-result">' +
        '<div class="mg-big">' + score + g.unit + '</div>' +
        '<div class="mg-sub">' +
          (isNew ? '🎉 さいこうきろく こうしん!' : ('さいこうきろく ' + best + g.unit)) +
        '</div>' +
        (extraMsg ? '<div class="mg-msg">' + esc(extraMsg) + '</div>' : '') +
      '</div>' +
      '<div class="mg-again">' +
        '<button class="mg-retry">もういちど</button>' +
        '<button class="mg-other">ほかのゲーム</button>' +
      '</div>';
    el.querySelector('.mg-retry').onclick = (opt && opt.retry) ? opt.retry : function(){ mgStart(id); };
    el.querySelector('.mg-other').onclick = mgShowMenu;
  }

  // --- ゲーム1: もぐらたたき ---
  function mgPlayMole(){
    var el = mgArea(); if(!el) return;
    var TIME = 30, score = 0, left = TIME;
    var cellsHtml = '';
    for(var i=0;i<9;i++){ cellsHtml += '<button class="mg-cell" data-i="' + i + '"></button>'; }
    el.innerHTML =
      mgBarHtml('mgStat1', '0てん', 'のこり ' + TIME + 'びょう') +
      '<div class="mg-grid" style="grid-template-columns:repeat(3,1fr);">' + cellsHtml + '</div>' +
      '<div class="mg-msg" id="mgMsg">🐹をタップ! 💣はさわらないでね</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var cells  = el.querySelectorAll('.mg-cell');
    var kind   = new Array(9); // null / 'mole' / 'bomb'

    function clearCell(i){
      kind[i] = null; cells[i].textContent = ''; cells[i].classList.remove('hit');
    }
    for(var k=0;k<9;k++){
      (function(idx){
        cells[idx].onclick = function(){
          if(kind[idx]==='mole'){
            score += 1;
            cells[idx].classList.add('hit');
            cells[idx].textContent = '💥';
            kind[idx] = null;
            mgTimeout(function(){ clearCell(idx); }, 160);
          } else if(kind[idx]==='bomb'){
            score = Math.max(0, score - 2);
            cells[idx].textContent = '💥';
            kind[idx] = null;
            msgEl.textContent = 'いてて! -2てん';
            mgTimeout(function(){ clearCell(idx); }, 200);
          }
          statEl.textContent = score + 'てん';
        };
      })(k);
    }

    mgInterval(function(){
      var empty = [];
      for(var i=0;i<9;i++){ if(!kind[i]) empty.push(i); }
      if(!empty.length) return;
      var idx = empty[Math.floor(Math.random()*empty.length)];
      var isBomb = Math.random() < 0.22;
      kind[idx] = isBomb ? 'bomb' : 'mole';
      cells[idx].textContent = isBomb ? '💣' : '🐹';
      var life = 750 + Math.random()*500;
      mgTimeout(function(){ if(kind[idx]) clearCell(idx); }, life);
    }, 620);

    mgInterval(function(){
      left--;
      timeEl.textContent = 'のこり ' + left + 'びょう';
      if(left<=0){ mgFinish('mole', score, 'もぐらを ' + score + 'ひき たたいたよ!'); }
    }, 1000);
  }

  // --- ゲーム2: いろおぼえ(ひかるじゅんばんを おぼえる) ---
  function mgPlaySimon(){
    var el = mgArea(); if(!el) return;
    var COLORS = ['#FF8A3D','#2BB7A4','#FF6B9D','#8B6FE8'];
    var seq = [], step = 0, cleared = 0, accepting = false;
    var btnHtml = '';
    for(var i=0;i<4;i++){ btnHtml += '<button data-c="' + i + '" style="background:' + COLORS[i] + ';"></button>'; }
    el.innerHTML =
      mgBarHtml('mgStat1', '1だんめ', 'よく見てね') +
      '<div class="mg-simon">' + btnHtml + '</div>' +
      '<div class="mg-msg" id="mgMsg">ひかったじゅんばんに タップしてね</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var modeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var btns   = el.querySelectorAll('.mg-simon button');

    function flash(i, ms){
      btns[i].classList.add('lit');
      mgTimeout(function(){ btns[i].classList.remove('lit'); }, ms || 350);
    }
    function playSeq(){
      accepting = false;
      modeEl.textContent = 'よく見てね';
      var d = 320;
      for(var i=0;i<seq.length;i++){
        (function(n, idx){
          mgTimeout(function(){ flash(idx, 300); }, 400 + n*(d+180));
        })(i, seq[i]);
      }
      mgTimeout(function(){
        accepting = true; step = 0;
        modeEl.textContent = 'さあ どうぞ!';
        msgEl.textContent = seq.length + 'こ タップしてね';
      }, 400 + seq.length*(d+180));
    }
    function nextLevel(){
      seq.push(Math.floor(Math.random()*4));
      statEl.textContent = seq.length + 'だんめ';
      playSeq();
    }
    for(var k=0;k<4;k++){
      (function(idx){
        btns[idx].onclick = function(){
          if(!accepting) return;
          flash(idx, 180);
          if(seq[step] === idx){
            step++;
            if(step >= seq.length){
              accepting = false;
              cleared++;
              msgEl.textContent = 'せいかい! つぎは ' + (seq.length+1) + 'こだよ';
              mgTimeout(nextLevel, 900);
            }
          } else {
            accepting = false;
            mgFinish('simon', cleared, cleared===0 ? 'つぎは がんばろう!' : (cleared + 'だんまで おぼえられたよ!'));
          }
        };
      })(k);
    }
    mgTimeout(nextLevel, 500);
  }

  // --- ゲーム3: はんしゃしんけい ---
  function mgPlayReact(){
    var el = mgArea(); if(!el) return;
    var TRIES = 3;
    var times = [], state = 'idle', startAt = 0, armId = null;
    el.innerHTML =
      mgBarHtml('mgStat1', '1かいめ / ' + TRIES, 'タップでスタート') +
      '<button class="mg-react" id="mgReactBtn" style="background:var(--purple);">タップして<br>スタート!</button>' +
      '<div class="mg-msg" id="mgMsg">みどりになったら すぐタップ!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var modeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var btn    = document.getElementById('mgReactBtn');

    function armNext(){
      state = 'wait';
      statEl.textContent = (times.length+1) + 'かいめ / ' + TRIES;
      modeEl.textContent = 'まだだよ…';
      btn.style.background = '#E0574F';
      btn.innerHTML = 'まだまだ…<br>まってね';
      armId = mgTimeout(function(){
        armId = null;
        state = 'go';
        startAt = Date.now();
        modeEl.textContent = 'いまだ!';
        btn.style.background = '#37B36B';
        btn.innerHTML = 'いま!<br>タップ!';
      }, 1300 + Math.random()*3000);
    }
    btn.onclick = function(){
      if(state==='idle'){ armNext(); return; }
      if(state==='wait'){
        if(armId){ clearTimeout(armId); armId = null; }
        state = 'idle';
        btn.style.background = 'var(--purple)';
        btn.innerHTML = 'はやすぎ!<br>もういちどタップ';
        modeEl.textContent = 'フライング';
        msgEl.textContent = 'みどりになるまで まってね';
        return;
      }
      if(state==='go'){
        var ms = Date.now() - startAt;
        times.push(ms);
        state = 'idle';
        msgEl.textContent = ms + 'ms! ' + (times.length<TRIES ? 'つぎも いくよ' : '');
        if(times.length >= TRIES){
          var sum = 0;
          for(var i=0;i<times.length;i++){ sum += times[i]; }
          var avg = Math.round(sum / times.length);
          mgFinish('react', avg, '3かいの へいきんだよ (' + times.join(' / ') + 'ms)');
        } else {
          btn.style.background = 'var(--purple)';
          btn.innerHTML = ms + 'ms!<br>タップで つぎへ';
          modeEl.textContent = 'タップでつぎへ';
        }
      }
    };
  }

  // --- ゲーム4: なかまはずれさがし ---
  function mgPlayOdd(){
    var el = mgArea(); if(!el) return;
    var PAIRS = [
      ['🐱','🐯'], ['🍎','🍓'], ['⭐','✨'], ['🐸','🐢'],
      ['🐭','🐹'], ['🍔','🍟'], ['🌞','🌝'], ['🐶','🐺'],
      ['🍇','🍒'], ['🚗','🚙'], ['😀','😆'], ['🌸','🌺']
    ];
    var TIME = 30, left = TIME, found = 0, level = 1;
    el.innerHTML =
      mgBarHtml('mgStat1', '0こ', 'のこり ' + TIME + 'びょう') +
      '<div class="mg-grid" id="mgOddGrid"></div>' +
      '<div class="mg-msg" id="mgMsg">1こだけ ちがうのを さがしてタップ!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var grid   = document.getElementById('mgOddGrid');

    function build(){
      var cols = Math.min(6, 2 + Math.floor((level-1)/2));
      var total = cols*cols;
      var pair = PAIRS[Math.floor(Math.random()*PAIRS.length)];
      var flip = Math.random() < 0.5;
      var base = flip ? pair[1] : pair[0];
      var odd  = flip ? pair[0] : pair[1];
      var oddIdx = Math.floor(Math.random()*total);
      var html = '';
      for(var i=0;i<total;i++){
        html += '<button class="mg-cell" data-i="' + i + '">' + (i===oddIdx ? odd : base) + '</button>';
      }
      grid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
      grid.innerHTML = html;
      var cells = grid.querySelectorAll('.mg-cell');
      for(var k=0;k<cells.length;k++){
        (function(idx, cell){
          cell.onclick = function(){
            if(idx===oddIdx){
              found++; level++;
              statEl.textContent = found + 'こ';
              msgEl.textContent = 'せいかい! つぎ いくよ';
              build();
            } else {
              left = Math.max(0, left - 2);
              timeEl.textContent = 'のこり ' + left + 'びょう';
              msgEl.textContent = 'ざんねん! -2びょう';
              cell.classList.add('hit');
            }
          };
        })(k, cells[k]);
      }
    }
    build();

    mgInterval(function(){
      left--;
      timeEl.textContent = 'のこり ' + left + 'びょう';
      if(left<=0){ mgFinish('odd', found, found + 'こ みつけられたよ!'); }
    }, 1000);
  }

  // --- ゲーム6: けいさんチャレンジ ---
  function mgPlayCalc(){
    var el = mgArea(); if(!el) return;
    var TIME = 30, left = TIME, score = 0;
    el.innerHTML =
      mgBarHtml('mgStat1', '0もん', 'のこり ' + TIME + 'びょう') +
      '<div class="mg-problem" id="mgProblem"></div>' +
      '<div class="mg-choices" id="mgChoices"></div>' +
      '<div class="mg-msg" id="mgMsg">こたえだとおもうボタンをタップ!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var probEl = document.getElementById('mgProblem');
    var choiceEl = document.getElementById('mgChoices');

    function newProblem(){
      var isPlus = Math.random() < 0.55;
      var a, b, answer;
      if(isPlus){
        a = 1 + Math.floor(Math.random()*20);
        b = 1 + Math.floor(Math.random()*20);
        answer = a + b;
      } else {
        a = 2 + Math.floor(Math.random()*20);
        b = 1 + Math.floor(Math.random()*(a-1));
        answer = a - b;
      }
      probEl.textContent = a + (isPlus ? ' + ' : ' − ') + b + ' = ?';
      var opts = [answer];
      while(opts.length < 3){
        var delta = 1 + Math.floor(Math.random()*4);
        var wrong = answer + (Math.random()<0.5 ? -delta : delta);
        if(wrong < 0) wrong = answer + delta;
        if(opts.indexOf(wrong) === -1) opts.push(wrong);
      }
      opts = shuffle(opts);
      var html = '';
      for(var i=0;i<opts.length;i++){ html += '<button class="mg-choice" data-v="' + opts[i] + '">' + opts[i] + '</button>'; }
      choiceEl.innerHTML = html;
      var btns = choiceEl.querySelectorAll('.mg-choice');
      for(var j=0;j<btns.length;j++){
        (function(btn){
          btn.onclick = function(){
            if(parseInt(btn.getAttribute('data-v'),10) === answer){
              score++;
              statEl.textContent = score + 'もん';
              msgEl.textContent = 'せいかい! つぎの もんだい';
              newProblem();
            } else {
              msgEl.textContent = 'ざんねん! もういちど';
            }
          };
        })(btns[j]);
      }
    }
    newProblem();

    mgInterval(function(){
      left--;
      timeEl.textContent = 'のこり ' + left + 'びょう';
      if(left<=0){ mgFinish('calc', score, score + 'もん とけたよ!'); }
    }, 1000);
  }

  // --- 追加ゲーム: しんけいすいじゃく ---
  function mgPlayMemory(){
    var el = mgArea(); if(!el) return;
    var EMOJIS = ['🐶','🐱','🐰','🐻','🐼','🐸','🐵','🦊','🐷','🐯'];
    var pairs = 6, moves = 0, found = 0, first = -1, lock = false;
    var deck = shuffle(EMOJIS).slice(0, pairs);
    deck = shuffle(deck.concat(deck));
    var cellsHtml = '';
    for(var i=0;i<deck.length;i++){ cellsHtml += '<button class="mg-cell" data-i="' + i + '">❓</button>'; }
    el.innerHTML =
      mgBarHtml('mgStat1', '0かい', 'ペア 0/' + pairs) +
      '<div class="mg-grid" style="grid-template-columns:repeat(4,1fr);">' + cellsHtml + '</div>' +
      '<div class="mg-msg" id="mgMsg">おなじ どうぶつを 2まい そろえよう!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var pairEl = document.getElementById('mgStat2');
    var cells = el.querySelectorAll('.mg-cell');
    var done = [];
    function show(i){ cells[i].textContent = deck[i]; cells[i].classList.add('hit'); }
    function hide(i){ cells[i].textContent = '❓'; cells[i].classList.remove('hit'); }
    for(var k=0;k<cells.length;k++){
      (function(idx){
        cells[idx].onclick = function(){
          if(lock || done[idx] || idx === first) return;
          show(idx);
          if(first < 0){ first = idx; return; }
          moves++; statEl.textContent = moves + 'かい';
          var a = first, b = idx; first = -1;
          if(deck[a] === deck[b]){
            done[a] = done[b] = true; found++;
            pairEl.textContent = 'ペア ' + found + '/' + pairs;
            if(found >= pairs){
              var sc = Math.max(10, 100 - (moves - pairs) * 8);
              mgTimeout(function(){ mgFinish('memory', sc, moves + 'かいで ぜんぶ そろえたよ!'); }, 500);
            }
          } else {
            lock = true;
            mgTimeout(function(){ hide(a); hide(b); lock = false; }, 700);
          }
        };
      })(k);
    }
  }

  // --- 追加ゲーム: すうじタップ(1からじゅんばんに) ---
  function mgPlayTapNum(){
    var el = mgArea(); if(!el) return;
    var N = 12, next = 1, t0 = 0, started = false;
    var nums = []; for(var n=1;n<=N;n++){ nums.push(n); }
    nums = shuffle(nums);
    var cellsHtml = '';
    for(var i=0;i<nums.length;i++){ cellsHtml += '<button class="mg-cell" data-n="' + nums[i] + '">' + nums[i] + '</button>'; }
    el.innerHTML =
      mgBarHtml('mgStat1', '0.0びょう', 'つぎは 1') +
      '<div class="mg-grid" style="grid-template-columns:repeat(4,1fr);">' + cellsHtml + '</div>' +
      '<div class="mg-msg" id="mgMsg">1から ' + N + 'まで、じゅんばんに タップ! さいしょのタップで スタート</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var nextEl = document.getElementById('mgStat2');
    var cells = el.querySelectorAll('.mg-cell');
    mgInterval(function(){
      if(started) statEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 'びょう';
    }, 100);
    for(var k=0;k<cells.length;k++){
      (function(btn){
        btn.onclick = function(){
          var v = parseInt(btn.getAttribute('data-n'), 10);
          if(!started){ started = true; t0 = Date.now(); }
          if(v === next){
            btn.classList.add('hit'); btn.style.opacity = '.3'; btn.disabled = true;
            next++;
            if(next > N){
              var sec = Math.round((Date.now() - t0) / 100) / 10;
              mgFinish('tapnum', sec, N + 'こ ぜんぶ タップしたよ!');
            } else { nextEl.textContent = 'つぎは ' + next; }
          }
        };
      })(cells[k]);
    }
  }

  // --- 追加ゲーム: じゃんけんれんしょう ---
  function mgPlayJanken(){
    var el = mgArea(); if(!el) return;
    var HANDS = ['✊','✌️','✋'];  // 0:グー 1:チョキ 2:パー
    var streak = 0;
    el.innerHTML =
      mgBarHtml('mgStat1', '0れんしょう', 'まけたら おわり') +
      '<div class="mg-problem" id="mgProblem" style="font-size:54px;">❓</div>' +
      '<div class="mg-choices" id="mgChoices">' +
        '<button class="mg-choice" data-h="0">✊</button><button class="mg-choice" data-h="1">✌️</button><button class="mg-choice" data-h="2">✋</button>' +
      '</div>' +
      '<div class="mg-msg" id="mgMsg">てを えらんでね!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var msgEl = document.getElementById('mgMsg');
    var probEl = document.getElementById('mgProblem');
    var btns = el.querySelectorAll('.mg-choice');
    var busy = false;
    for(var k=0;k<btns.length;k++){
      (function(btn){
        btn.onclick = function(){
          if(busy) return;
          var me = parseInt(btn.getAttribute('data-h'), 10);
          var cpu = Math.floor(Math.random()*3);
          probEl.textContent = HANDS[cpu];
          var diff = (me - cpu + 3) % 3; // 0:あいこ 1:かち(2が1に…) 
          // グー0>チョキ1>パー2>グー0 なので me が cpu に勝つのは (cpu - me + 3)%3 === 1
          var win = ((cpu - me + 3) % 3 === 1);
          if(diff === 0){ msgEl.textContent = 'あいこ! もういちど'; return; }
          if(win){
            streak++; statEl.textContent = streak + 'れんしょう';
            msgEl.textContent = 'かち! つぎも がんばれ';
          } else {
            busy = true;
            msgEl.textContent = 'まけちゃった…';
            mgTimeout(function(){ mgFinish('janken', streak, streak + 'れんしょう したよ!'); }, 800);
          }
        };
      })(btns[k]);
    }
  }

  // --- 追加ゲーム: どっちがおおきい? ---
  function mgPlayBigger(){
    var el = mgArea(); if(!el) return;

  function mgPlayCount(){
    var el = mgArea(); if(!el) return;
    var Q = 8, qi = 0, score = 0;
    var ICONS = ['🍎','⭐','🐟','🌸','🎈','🍪'];
    el.innerHTML =
      mgBarHtml('mgStat1', '0もん', '1 / ' + Q) +
      '<div class="mg-sky" id="mgCountField" style="height:170px;"></div>' +
      '<div class="mg-choices" id="mgChoices" style="margin-top:10px;"></div>' +
      '<div class="mg-msg" id="mgMsg">ぱっと でる かずを かぞえてね!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var qEl = document.getElementById('mgStat2');
    var field = document.getElementById('mgCountField');
    var choiceEl = document.getElementById('mgChoices');
    var msgEl = document.getElementById('mgMsg');
    function ask(){
      qi++; qEl.textContent = qi + ' / ' + Q;
      var cnt = 3 + Math.floor(Math.random()*(4 + Math.min(qi, 5)));
      var icon = ICONS[Math.floor(Math.random()*ICONS.length)];
      var h = '';
      for(var i=0;i<cnt;i++){
        h += '<span style="position:absolute;font-size:26px;left:' + (4 + Math.random()*84) + '%;top:' + (4 + Math.random()*72) + '%;">' + icon + '</span>';
      }
      field.innerHTML = h; choiceEl.innerHTML = '';
      msgEl.textContent = 'いくつ あるかな…?';
      mgTimeout(function(){
        field.innerHTML = '<div style="text-align:center;padding-top:60px;font-size:40px;">❓</div>';
        var opts = [cnt];
        while(opts.length < 3){
          var w = cnt + (Math.random() < .5 ? -1 : 1) * (1 + Math.floor(Math.random()*2));
          if(w >= 1 && opts.indexOf(w) < 0) opts.push(w);
        }
        opts = shuffle(opts);
        var html = '';
        for(var j=0;j<opts.length;j++){ html += '<button class="mg-choice" data-v="' + opts[j] + '">' + opts[j] + '</button>'; }
        choiceEl.innerHTML = html;
        msgEl.textContent = 'いくつだった?';
        var btns = choiceEl.querySelectorAll('.mg-choice');
        for(var m=0;m<btns.length;m++){
          (function(btn){
            btn.onclick = function(){
              var ok = (parseInt(btn.getAttribute('data-v'), 10) === cnt);
              if(ok){ score++; statEl.textContent = score + 'もん'; }
              choiceEl.innerHTML = '';
              msgEl.textContent = ok ? 'せいかい! 🎉' : ('ざんねん… こたえは ' + cnt + 'こ');
              mgTimeout(function(){
                if(qi >= Q){ mgFinish('count', score, Q + 'もんちゅう ' + score + 'もん せいかい!'); }
                else { ask(); }
              }, 900);
            };
          })(btns[m]);
        }
      }, 1400 + cnt * 60);
    }
    ask();
  }

  // --- 追加ゲーム: よけよけゲーム(3レーン) ---
  function mgPlayDodge(){
    var el = mgArea(); if(!el) return;
    var W = 3, H = 8, lane = 1, score = 0, tick = 0, alive = true, life = 3;
    var objs = []; // {lane,row,kind}
    el.innerHTML =
      mgBarHtml('mgStat1', '0てん', '❤️❤️❤️') +
      '<div id="mgDodgeField" style="position:relative;height:240px;border-radius:16px;background:linear-gradient(#DDF2FF,#F4FBFF);overflow:hidden;touch-action:manipulation;"></div>' +
      '<div class="mg-choices" style="margin-top:10px;"><button class="mg-choice" id="mgDL">◀</button><button class="mg-choice" id="mgDR">▶</button></div>' +
      '<div class="mg-msg" id="mgMsg">🍎はとる! 🪨はよける!</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var lifeEl = document.getElementById('mgStat2');
    var field = document.getElementById('mgDodgeField');
    function draw(){
      var h = '';
      var cw = 100 / W, rh = 240 / H;
      for(var i=0;i<objs.length;i++){
        var o = objs[i];
        h += '<span style="position:absolute;width:' + cw + '%;left:' + (o.lane*cw) + '%;top:' + (o.row*rh) + 'px;text-align:center;font-size:28px;line-height:' + rh + 'px;">' + (o.kind === 'a' ? '🍎' : '🪨') + '</span>';
      }
      h += '<span style="position:absolute;width:' + cw + '%;left:' + (lane*cw) + '%;top:' + ((H-1)*rh) + 'px;text-align:center;font-size:30px;line-height:' + rh + 'px;">🐱</span>';
      field.innerHTML = h;
    }
    function move(d){ lane = Math.max(0, Math.min(W-1, lane + d)); draw(); }
    document.getElementById('mgDL').onclick = function(){ move(-1); };
    document.getElementById('mgDR').onclick = function(){ move(1); };
    field.onclick = function(e){
      var r = field.getBoundingClientRect();
      lane = Math.max(0, Math.min(W-1, Math.floor((e.clientX - r.left) / r.width * W)));
      draw();
    };
    var speedMs = 420;
    function step(){
      tick++;
      for(var i=0;i<objs.length;i++){ objs[i].row++; }
      if(tick % 2 === 0){ objs.push({ lane: Math.floor(Math.random()*W), row: 0, kind: Math.random() < 0.3 ? 'a' : 'r' }); }
      var keep = [];
      for(var j=0;j<objs.length;j++){
        var o = objs[j];
        if(o.row === H-1 && o.lane === lane){
          if(o.kind === 'a'){ score += 2; statEl.textContent = score + 'てん'; }
          else { life--; lifeEl.textContent = new Array(Math.max(life,0)+1).join('❤️') || '💔'; }
          continue;
        }
        if(o.row >= H){
          if(o.kind === 'r'){ score += 1; statEl.textContent = score + 'てん'; }
          continue;
        }
        keep.push(o);
      }
      objs = keep;
      draw();
      if(life <= 0){ mgFinish('dodge', score, 'ぶつかっちゃった! ' + score + 'てん'); }
    }
    draw();
    mgInterval(step, speedMs);
    mgTimeout(function(){ mgFinish('dodge', score, 'タイムアップ! ' + score + 'てん'); }, 45000);
  }

  // --- ゲーム7: とめて!ゲーム(まんなかでとめよう) ---
  function mgPlayStop(){
    var el = mgArea(); if(!el) return;
    var ROUNDS = 3, round = 0, totalScore = 0, pos = 0, dir = 1, speed = 2.4, running = false;
    el.innerHTML =
      mgBarHtml('mgStat1', '1かいめ / ' + ROUNDS, 'まんなかでとめよう') +
      '<div class="mg-track"><div class="mg-target" id="mgTarget" style="left:42%;"></div><div class="mg-marker" id="mgMarker"></div></div>' +
      '<button class="mg-stop-btn" id="mgStopBtn">とめる!</button>' +
      '<div class="mg-msg" id="mgMsg">うごくマーカーを きいろのところでとめてね</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var msgEl  = document.getElementById('mgMsg');
    var marker = document.getElementById('mgMarker');
    var btn    = document.getElementById('mgStopBtn');

    function startRound(){
      pos = 0; dir = 1; running = true;
      speed = 2.2 + round*0.6;
      btn.textContent = 'とめる!';
      mgInterval(function(){
        if(!running) return;
        pos += dir*speed;
        if(pos >= 100){ pos = 100; dir = -1; }
        if(pos <= 0){ pos = 0; dir = 1; }
        marker.style.left = pos + '%';
      }, 20);
    }
    btn.onclick = function(){
      if(!running) return;
      running = false;
      var dist = Math.abs(pos - 50);
      var score = Math.max(0, Math.round(100 - dist*4));
      totalScore += score;
      round++;
      msgEl.textContent = score + 'てん! (' + round + ' / ' + ROUNDS + ')';
      if(round >= ROUNDS){
        var avg = Math.round(totalScore/ROUNDS);
        mgTimeout(function(){ mgFinish('stop', avg, ROUNDS + 'かいの へいきんだよ'); }, 700);
      } else {
        statEl.textContent = (round+1) + 'かいめ / ' + ROUNDS;
        mgTimeout(startRound, 700);
      }
    };
    startRound();
  }


  // --- ゲーム: フルーツがったい(おなじフルーツをぶつけて大きく育てる) ---
  var MG_FRUITS = [
    { e:'🍒', r:12, c:'#E5484D' },
    { e:'🍓', r:16, c:'#FF6B81' },
    { e:'🍇', r:21, c:'#8B5CF6' },
    { e:'🍊', r:26, c:'#FF9F1C' },
    { e:'🍎', r:32, c:'#EF4444' },
    { e:'🍐', r:38, c:'#A3D977' },
    { e:'🍑', r:45, c:'#FFB4A2' },
    { e:'🍍', r:52, c:'#FACC15' },
    { e:'🍈', r:60, c:'#86EFAC' },
    { e:'🍉', r:69, c:'#22C55E' }
  ];
  function mgPlayFruit(){
    var el = mgArea(); if(!el) return;
    var tok = mgToken;
    var W = 300, H = 420, LINE = 70, SPAWN_Y = 34, GRAV = 0.17, SUB = 2, MAXV = 8;
    var balls = [], nextId = 1, score = 0, over = false, cooldown = 0, aimX = W/2;
    var overFrames = 0, frame = 0;
    var curLvl = mgFruitPick(), nextLvl = mgFruitPick();
    function mgFruitPick(){ var r = Math.random(); return r<0.35 ? 0 : (r<0.65 ? 1 : (r<0.88 ? 2 : 3)); }

    var legend = '';
    for(var i=0;i<MG_FRUITS.length;i++){ legend += '<span>' + MG_FRUITS[i].e + '</span>'; }
    el.innerHTML =
      mgBarHtml('mgStat1', '0てん', '') +
      '<div class="mg-fruit-wrap">' +
        '<canvas class="mg-fruit-canvas" id="mgFruitCv" width="' + W + '" height="' + H + '" style="aspect-ratio:' + W + '/' + H + ';"></canvas>' +
        '<div class="mg-fruit-legend">' + legend + '</div>' +
      '</div>' +
      '<div class="mg-msg" id="mgMsg">ゆびでよこにうごかして、はなすとおとすよ。おなじフルーツがくっつくと大きくなる!</div>';
    mgWireBack();
    var cv = document.getElementById('mgFruitCv');
    var ctx = cv.getContext('2d');
    var statEl = document.getElementById('mgStat1');
    var nextEl = document.getElementById('mgStat2');
    function showNext(){ nextEl.textContent = 'つぎ: ' + MG_FRUITS[nextLvl].e; }
    showNext();

    function setAim(e){
      var rc = cv.getBoundingClientRect();
      aimX = (e.clientX - rc.left) / rc.width * W;
    }
    function drop(){
      if(over || cooldown>0) return;
      var f = MG_FRUITS[curLvl];
      var x = Math.max(f.r, Math.min(W-f.r, aimX));
      balls.push({ id:nextId++, x:x, y:SPAWN_Y, vx:0, vy:0, lvl:curLvl, r:f.r, age:0, dead:false });
      curLvl = nextLvl; nextLvl = mgFruitPick(); showNext();
      cooldown = 38;
    }
    cv.addEventListener('pointerdown', function(e){ setAim(e); try{ cv.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); });
    cv.addEventListener('pointermove', function(e){ setAim(e); });
    cv.addEventListener('pointerup', function(e){ setAim(e); drop(); e.preventDefault(); });

    function addScore(n){ score += n; statEl.textContent = score + 'てん'; }

    function step(){
      var i, j, a, b;
      for(var sub=0; sub<SUB; sub++){
        for(i=0;i<balls.length;i++){
          a = balls[i];
          a.vy += GRAV;
          if(a.vy > MAXV) a.vy = MAXV;
          if(a.vx > MAXV) a.vx = MAXV; else if(a.vx < -MAXV) a.vx = -MAXV;
          a.x += a.vx; a.y += a.vy;
          a.vx *= 0.998;
          if(a.x < a.r){ a.x = a.r; if(a.vx<0) a.vx = -a.vx*0.2; }
          if(a.x > W-a.r){ a.x = W-a.r; if(a.vx>0) a.vx = -a.vx*0.2; }
          if(a.y > H-a.r){
            a.y = H-a.r;
            if(a.vy>0) a.vy = (a.vy>1.2) ? -a.vy*0.12 : 0;
            a.vx *= 0.92;
          }
        }
        for(var it=0; it<4; it++){
          for(i=0;i<balls.length;i++){
            a = balls[i];
            if(a.dead) continue;
            for(j=i+1;j<balls.length;j++){
              b = balls[j];
              if(b.dead || a.dead) continue;
              var dx = b.x-a.x, dy = b.y-a.y, rr = a.r+b.r;
              if(dx*dx+dy*dy >= rr*rr) continue;
              if(a.lvl===b.lvl){
                // がったい!
                var nl = a.lvl+1;
                a.dead = true; b.dead = true;
                if(nl >= MG_FRUITS.length){
                  addScore(100);
                } else {
                  var nr = MG_FRUITS[nl].r;
                  var ma = a.r*a.r, mb = b.r*b.r;
                  balls.push({ id:nextId++, x:(a.x*ma+b.x*mb)/(ma+mb), y:(a.y*ma+b.y*mb)/(ma+mb),
                               vx:(a.vx+b.vx)/2, vy:(a.vy+b.vy)/2*0.5, lvl:nl, r:nr, age:a.age+b.age>60?60:30, dead:false, pop:12 });
                  addScore(nl*(nl+1)/2 + 1);
                }
                continue;
              }
              var d = Math.sqrt(dx*dx+dy*dy);
              var nx, ny;
              if(d < 0.0001){ nx = 0; ny = -1; d = 0.0001; } else { nx = dx/d; ny = dy/d; }
              var ov = rr - d;
              var m1 = a.r*a.r, m2 = b.r*b.r, ms = m1+m2;
              a.x -= nx*ov*(m2/ms); a.y -= ny*ov*(m2/ms);
              b.x += nx*ov*(m1/ms); b.y += ny*ov*(m1/ms);
              var rvx = b.vx-a.vx, rvy = b.vy-a.vy;
              var vn = rvx*nx + rvy*ny;
              if(vn < 0){
                var jn = -(1+0.08)*vn / (1/m1 + 1/m2);
                a.vx -= jn*nx/m1; a.vy -= jn*ny/m1;
                b.vx += jn*nx/m2; b.vy += jn*ny/m2;
                // まさつ(よこすべりをすこしおさえる)
                var tx = -ny, ty = nx, vt = rvx*tx + rvy*ty;
                var jt = -vt*0.06 / (1/m1 + 1/m2);
                a.vx -= jt*tx/m1; a.vy -= jt*ty/m1;
                b.vx += jt*tx/m2; b.vy += jt*ty/m2;
              }
            }
          }
        }
        // 壁にめりこまないよう もういちど補正
        for(i=0;i<balls.length;i++){
          a = balls[i];
          if(a.x < a.r) a.x = a.r;
          if(a.x > W-a.r) a.x = W-a.r;
          if(a.y > H-a.r) a.y = H-a.r;
        }
        // 消えたボールをとりのぞく
        if(balls.some(function(q){ return q.dead; })){
          balls = balls.filter(function(q){ return !q.dead; });
        }
      }
    }

    function checkOver(){
      var danger = false;
      for(var i=0;i<balls.length;i++){
        var a = balls[i];
        a.age++;
        if(a.age > 90 && a.y - a.r < LINE && Math.abs(a.vy) < 0.6){ danger = true; }
      }
      overFrames = danger ? overFrames+1 : Math.max(0, overFrames-2);
      return overFrames > 120;
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      // ゲームオーバーライン
      ctx.save();
      ctx.strokeStyle = (overFrames>0 && (frame%20<10)) ? '#E5484D' : 'rgba(201,138,75,.7)';
      ctx.lineWidth = 2; ctx.setLineDash([8,6]);
      ctx.beginPath(); ctx.moveTo(0,LINE); ctx.lineTo(W,LINE); ctx.stroke();
      ctx.restore();
      // ねらいのガイドとつぎのフルーツ
      if(!over){
        var cf = MG_FRUITS[curLvl];
        var gx = Math.max(cf.r, Math.min(W-cf.r, aimX));
        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.setLineDash([4,6]);
        ctx.beginPath(); ctx.moveTo(gx, SPAWN_Y); ctx.lineTo(gx, H); ctx.stroke();
        ctx.restore();
        if(cooldown<=0) mgFruitDrawOne(ctx, gx, SPAWN_Y, cf, 1, 1);
      }
      for(var i=0;i<balls.length;i++){
        var a = balls[i];
        var sc = 1;
        if(a.pop>0){ sc = 1 + 0.12*Math.sin(a.pop/12*Math.PI); a.pop--; }
        mgFruitDrawOne(ctx, a.x, a.y, MG_FRUITS[a.lvl], sc, 1);
      }
    }

    function loop(){
      if(!mgAlive(tok)) return;
      frame++;
      if(!over){
        if(cooldown>0) cooldown--;
        step();
        if(checkOver()){
          over = true;
          draw();
          mgTimeout(function(){
            var big = 0;
            for(var i=0;i<balls.length;i++){ if(balls[i].lvl>big) big = balls[i].lvl; }
            mgFinish('fruit', score, 'いちばん大きく育てたのは ' + MG_FRUITS[big].e);
          }, 900);
          return;
        }
      }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
  function mgFruitDrawOne(ctx, x, y, f, scale, alpha){
    var r = f.r*scale;
    ctx.save();
    ctx.globalAlpha = alpha;
    var g = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.1, x, y, r);
    g.addColorStop(0, '#fff');
    g.addColorStop(0.25, f.c);
    g.addColorStop(1, f.c);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke();
    ctx.font = Math.round(r*1.25) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.e, x, y + r*0.06);
    ctx.restore();
  }

      for(i = 0; i < pool.length; i++){ out.push([pool[i], pool[i]]); }
      return out;
    }
    return (kind === 'sentence' ? MG_SENTENCES : MG_WORDS)[lv];
  }
  function mgShuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function mgPick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  // ---- ローマ字エンジン ----
  function mgReadUnit(word, i){
    var two = word.substr(i, 2);
    if(MG_YOUON[two]) return { alts: MG_YOUON[two], len: 2 };
    var c = word.charAt(i);
    return { alts: MG_KANA[c] || null, len: 1 };
  }
  // くんれいしきを えらんだら、ひょうじに 「shi/chi/tsu/fu/ji」を つかわないほうを さきにする
  function mgOrderAlts(alts, pref){
    if(pref !== 'kunrei' || alts.length < 2) return alts.slice();
    var a = [], b = [], i;
    for(i = 0; i < alts.length; i++){ (/sh|ch|ts|f|j/.test(alts[i]) ? b : a).push(alts[i]); }
    return a.concat(b);
  }
  function mgBuildTokens(word, pref){
    var tokens = [], i = 0, k, a;
    while(i < word.length){
      var c = word.charAt(i);
      if(MG_SKIP.test(c)){ i++; continue; }
      if(c === 'っ'){
        var j = i + 1;
        while(j < word.length && MG_SKIP.test(word.charAt(j))){ j++; }
        var u = (j < word.length) ? mgReadUnit(word, j) : null;
        if(u && u.alts){
          var base = mgOrderAlts(u.alts, pref), alts = [];
          for(a = 0; a < base.length; a++){
            alts.push(/^[aiueon]/.test(base[a]) ? base[a] : base[a].charAt(0) + base[a]);
          }
          tokens.push({ alts: alts, isN: false });
          i = j + u.len;
        } else { i++; }
        continue;
      }
      var u2 = mgReadUnit(word, i);
      if(!u2.alts){ i++; continue; }  // うてない もじは とばす
      tokens.push({ alts: mgOrderAlts(u2.alts, pref), isN: c === 'ん' });
      i += u2.len;
    }
    // 「ん」: ことばのさいごは nn だけ(ひょうじとおなじ)。つぎが あ行・や行・な行 のときも nn だけ
    // (na などとまざるため)。それいがいは n でも nn でもよい。
    for(var t = 0; t < tokens.length; t++){
      if(!tokens[t].isN) continue;
      if(t === tokens.length - 1){ tokens[t].alts = ['nn']; continue; }
      var nx = tokens[t + 1].alts, dbl = false;
      for(k = 0; k < nx.length; k++){ if(/^[aiueoyn]/.test(nx[k])) dbl = true; }
      if(dbl) tokens[t].alts = ['nn'];
    }
    return tokens;
  }
  function mgTyper(word, pref){
    var tokens = mgBuildTokens(word, pref);
    return { word: word, tokens: tokens, ti: 0, buf: '', typed: '', skipN: false, finished: tokens.length === 0 };
  }
  // このキーをうったら すすめる? (じっさいにはすすめない)
  function mgTypeAccepts(t, ch){
    if(t.finished) return false;
    if(t.skipN && ch === 'n') return true;
    var alts = t.tokens[t.ti].alts, p = t.buf + ch;
    for(var i = 0; i < alts.length; i++){ if(alts[i].indexOf(p) === 0) return true; }
    return false;
  }
  // 'ok' / 'miss' / 'done'(ことばぜんぶ うちおわった)
  function mgTypeFeed(t, ch){
    if(t.finished) return 'miss';
    var skip = t.skipN;
    t.skipN = false;
    if(skip && ch === 'n' && t.buf === ''){ t.typed += 'n'; return 'ok'; } // 「ん」を nn でうったとき
    var alts = t.tokens[t.ti].alts, p = t.buf + ch, ok = false, exact = false;
    for(var i = 0; i < alts.length; i++){
      if(alts[i].indexOf(p) === 0){ ok = true; if(alts[i] === p) exact = true; }
    }
    if(!ok) return 'miss';
    t.buf = p; t.typed += ch;
    if(exact){
      var wasN = t.tokens[t.ti].isN && p === 'n';
      t.ti++; t.buf = '';
      if(t.ti >= t.tokens.length){ t.finished = true; return 'done'; }
      if(wasN) t.skipN = true;
    }
    return 'ok';
  }
  function mgTypeView(t){
    var rest = '';
    if(!t.finished){
      var alts = t.tokens[t.ti].alts, cur = alts[0];
      for(var i = 0; i < alts.length; i++){
        if(alts[i].indexOf(t.buf) === 0){ cur = alts[i]; break; }
      }
      rest = cur.substr(t.buf.length);
      for(var k = t.ti + 1; k < t.tokens.length; k++){ rest += t.tokens[k].alts[0]; }
    }
    return { typed: t.typed, rest: rest };
  }
  function mgRomaHtml(t){
    var v = mgTypeView(t);
    return '<span class="done">' + esc(v.typed) + '</span>' + esc(v.rest);
  }
  function mgNextKey(t){ return t.finished ? '' : mgTypeView(t).rest.charAt(0); }
  function mgFirstChars(t){
    if(!t.tokens.length) return '';
    var alts = t.tokens[0].alts, s = '';
    for(var i = 0; i < alts.length; i++){ s += alts[i].charAt(0); }
    return s;
  }

  // ---- じぶんで いれた ぶん(カタカナ→ひらがな、うてない もじは のぞく) ----
  function mgKataToHira(c){
    var code = c.charCodeAt(0);
    return (code >= 0x30A1 && code <= 0x30F6) ? String.fromCharCode(code - 0x60) : c;
  }
  function mgSanitize(line){
    var out = '', dropped = 0, i = 0;
    while(i < line.length){
      var c = mgKataToHira(line.charAt(i));
      if(MG_SKIP.test(c)){ out += c; i++; continue; }
      var two = c + mgKataToHira(line.charAt(i + 1) || '');
      if(MG_YOUON[two]){ out += two; i += 2; continue; }
      if(c === 'っ'){
        var n = mgKataToHira(line.charAt(i + 1) || '');
        var n2 = n + mgKataToHira(line.charAt(i + 2) || '');
        if(MG_YOUON[n2] || (MG_KANA[n] && n !== 'ん' && n !== 'ー')){ out += c; } else { dropped++; }
        i++; continue;
      }
      if(MG_KANA[c]){ out += c; i++; continue; }
      dropped++; i++;
    }
    return { text: out, dropped: dropped };
  }
  function mgParseCustom(text){
    var raw = String(text || '').split(/\r?\n/), lines = [], dropped = 0;
    for(var i = 0; i < raw.length && lines.length < 60; i++){
      var r = mgSanitize(raw[i].replace(/^\s+|\s+$/g, ''));
      dropped += r.dropped;
      if(r.text && mgBuildTokens(r.text, 'hepburn').length > 0){
        lines.push(r.text.length > 70 ? r.text.substr(0, 70) : r.text);
      }
    }
    return { lines: lines, dropped: dropped };
  }

  // にゅうりょくらんに うたれた a-z と - を 1もじずつ onKey に わたす
  function mgWireTypeInput(onKey){
    var inp = document.getElementById('mgTypeInput');
    if(!inp) return;
    function flush(){
      var v = String(inp.value || '').toLowerCase();
      inp.value = '';
      for(var i = 0; i < v.length; i++){
        var ch = v.charAt(i);
        if(/[a-z\-]/.test(ch)) onKey(ch);
      }
    }
    inp.oninput = function(e){ if(e && e.isComposing) return; flush(); };
    inp.oncompositionend = flush;
    try{ inp.focus(); }catch(e){}
  }
  var MG_KB_ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm-'];
  // ゆびの わりあて: 0〜3=ひだりて(こゆび・くすりゆび・なかゆび・ひとさしゆび) 4〜7=みぎて
  var MG_FINGER = { q:0,a:0,z:0, w:1,s:1,x:1, e:2,d:2,c:2, r:3,f:3,v:3,t:3,g:3,b:3,
                    y:4,h:4,n:4,u:4,j:4,m:4, i:5,k:5, o:6,l:6, p:7,'-':7 };
  var MG_FCOL = ['#FFD6E0','#FFE3BD','#FFF4B3','#D6F2DD','#D6EAFF','#FFF4B3','#FFE3BD','#FFD6E0'];
  function mgKeyboardHtml(){

  }
  // つぎにうつキーを ひからせる / まちがえたキーを あかくする
  function mgKb(enabled){
    var prev = null, nextCh = '';
    return {
      next: function(ch){

  // ---- せっていがめん ----
  var MG_TSET_KEY = 'rakugaki_typing_settings';
  var MG_TCUSTOM_KEY = 'rakugaki_typing_custom';
  var MG_TDEFAULT = { kind: 'word', level: 1, upper: true, pref: 'hepburn', kb: true };
  function mgLoadTSet(){
    var s = {};
    try{ s = JSON.parse(localStorage.getItem(MG_TSET_KEY) || '{}') || {}; }catch(e){ s = {}; }
    var o = {};
    for(var k in MG_TDEFAULT){ o[k] = (s[k] === undefined) ? MG_TDEFAULT[k] : s[k]; }
    return o;
  }
  function mgSaveTSet(o){ try{ localStorage.setItem(MG_TSET_KEY, JSON.stringify(o)); }catch(e){} }

  var MG_G_KIND  = { key:'kind',  label:'もんだい', type:'str',  opts:[['kana','もじ'],['word','ことば'],['sentence','ぶん']] };
  var MG_G_LEVEL = { key:'level', label:'がくねん', type:'num',  opts:[[1,'1・2ねん'],[2,'3・4ねん'],[3,'5・6ねん']] };
  var MG_G_CASE  = { key:'upper', label:'ローマじ', type:'bool', opts:[[true,'おおもじ'],[false,'こもじ']] };
  var MG_G_PREF  = { key:'pref',  label:'ひょうじ', type:'str',  opts:[['hepburn','ヘボンしき'],['kunrei','くんれいしき']] };
  var MG_G_KB    = { key:'kb',    label:'キーボード', type:'bool', opts:[[true,'ひょうじする'],[false,'ひょうじしない']] };

  // opt: { best, unit, topHtml(), beforeRender(), onStart(settings, errEl) }
  function mgTypeSetup(title, groups, opt){
    mgStop();
    var el = mgArea(); if(!el) return;
    var s = mgLoadTSet();
    var hasKind = false, gi;
    for(gi = 0; gi < groups.length; gi++){ if(groups[gi].key === 'kind') hasKind = true; }
    function parse(g, raw){ return g.type === 'num' ? Number(raw) : (g.type === 'bool' ? raw === 'true' : raw); }
    function render(){
      var html = '<div class="mg-setup-title">' + esc(title) + '</div>';
      if(opt.topHtml) html += opt.topHtml();
      for(var a = 0; a < groups.length; a++){
        var g = groups[a];
        html += '<div class="mg-setgroup"><span class="mg-setlabel">' + esc(g.label) + '</span><span class="mg-chips">';
        for(var oi = 0; oi < g.opts.length; oi++){
          var on = String(s[g.key]) === String(g.opts[oi][0]);
          html += '<button class="mg-chip' + (on ? ' on' : '') + '" data-k="' + g.key + '" data-v="' + g.opts[oi][0] + '">' + esc(g.opts[oi][1]) + '</button>';
        }
        html += '</span></div>';
      }
      var note = '';
      if(opt.best){
        var bv = mgGetBest(opt.best + '_' + s.kind + '_' + s.level);
        note += 'さいこうきろく: ' + (bv === null ? 'まだなし' : bv + opt.unit);
      }
      if(hasKind && s.kind === 'kana'){
        note += '<br>もじ: 1・2ねん=あ〜ん / 3・4ねん=だくおん・はんだくおん / 5・6ねん=ようおん';
      }
      html += '<div class="mg-setnote">' + note + '</div>' +
              '<div class="mg-setnote mg-seterr" id="mgSetErr"></div>' +
              '<div class="mg-again"><button class="mg-retry" id="mgGo">スタート!</button><button class="mg-other" id="mgSetBack">もどる</button></div>';
      el.innerHTML = html;
      var chips = el.querySelectorAll('.mg-chip');
      for(var c = 0; c < chips.length; c++){
        (function(chip){
          chip.onclick = function(){
            if(opt.beforeRender) opt.beforeRender();
            var k = chip.getAttribute('data-k'), g2 = null;
            for(var j = 0; j < groups.length; j++){ if(groups[j].key === k) g2 = groups[j]; }
            if(g2){ s[k] = parse(g2, chip.getAttribute('data-v')); mgSaveTSet(s); }
            render();
          };
        })(chips[c]);
      }
      document.getElementById('mgGo').onclick = function(){
        if(opt.beforeRender) opt.beforeRender();
        mgSaveTSet(s);
        opt.onStart(s, document.getElementById('mgSetErr'));
      };
      document.getElementById('mgSetBack').onclick = mgShowMenu;
      if(opt.afterRender) opt.afterRender(el, render);
    }
    render();
  }

  //   Firebase:  gartic/songs/<id>      = { title, lyrics, audioUrl, hasAudio, createdAt }
  //              gartic/songAudio/<id>  = おんがくファイル(data URL・ファイルをあげたときだけ)

  // ======================================================================
  var MG_SONGSEL_KEY = 'rakugaki_typing_song';   // さいごに えらんだ うた
  var MG_ADMIN_SS = 'rakugaki_song_admin_ok';    // このタブで かんりしゃロックを といた

  async function mgSongsLoad(){
    var list = [];
    if(!db) return list;
    var v = await dbGet('gartic/songs');
    if(v){
      for(var k in v){
        if(v[k] && v[k].title){
          list.push({ id:k, title:String(v[k].title), lyrics:String(v[k].lyrics || ''),
                      audioUrl:String(v[k].audioUrl || ''), hasAudio:!!v[k].hasAudio, createdAt:v[k].createdAt || 0 });
        }
      }
    }
    list.sort(function(a, b){ return a.createdAt - b.createdAt; });
    return list;
  }
  async function mgSongPut(rec, audioData, removeAudio){
    if(!db) return false;
    if(audioData){
      if(!(await dbSet('gartic/songAudio/' + rec.id, audioData))) return false;
    } else if(removeAudio){
      await dbSet('gartic/songAudio/' + rec.id, null);
    }
    return await dbSet('gartic/songs/' + rec.id, {
      title: rec.title, lyrics: rec.lyrics, audioUrl: rec.audioUrl, hasAudio: !!rec.hasAudio, createdAt: rec.createdAt
    });
  }
  async function mgSongDel(id){
    if(!db) return false;
    await dbSet('gartic/songAudio/' + id, null);
    return await dbSet('gartic/songs/' + id, null);
  }
  function mgReadFile(file){
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ res(r.result); };
      r.onerror = function(){ rej(new Error('read')); };
      r.readAsDataURL(file);
    });
  }
  async function mgHash(str){
    var s = 'rakugaki-song:' + str;
    try{
      if(window.crypto && window.crypto.subtle){
        var buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
      }
    }catch(e){}
    var h = 5381;
    for(var i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return 'x' + (h >>> 0).toString(16);
  }

      '<div class="mg-admin-sub" style="margin-top:8px;"><b>きょく(おんがく)</b> ※なくてもOK。URLか ファイル(3MBまで)のどちらか</div>' +
      '<input type="text" class="mg-input" id="mgAdUrl" autocomplete="off" placeholder="おんがくの URL (https://....mp3)" value="' + esc(cur ? cur.audioUrl : '') + '">' +
      '<input type="file" class="mg-input" id="mgAdFile" accept="audio/*">' +
      ((cur && cur.hasAudio) ? '<label class="mg-admin-sub" style="display:block;"><input type="checkbox" id="mgAdClear"> いま ほぞんされている おんがくファイルを けす</label>' : '') +
      '<div class="mg-setnote ' + (msg && msg.err ? 'mg-seterr' : '') + '" id="mgAdErr">' + esc(msg ? msg.text : '') + '</div>' +
      '<div class="mg-again"><button class="mg-retry" id="mgAdSave">ほぞん</button>' +
      (cur ? '<button class="mg-other" id="mgAdNew" style="background:var(--orange);">あたらしく つくる</button>' : '') +
      '<button class="mg-other" id="mgAdBack">もどる</button></div>' +
      '<div style="text-align:center; margin-top:10px;"><button class="mg-adminbtn" id="mgAdPass">パスワードを かえる</button> <button class="mg-adminbtn" id="mgAdLock">ロックする</button></div>';
    el.innerHTML = html;

    function err(t){ var e = document.getElementById('mgAdErr'); if(e){ e.className = 'mg-setnote mg-seterr'; e.textContent = t; } }
    var eb = el.querySelectorAll('[data-edit]'), db2 = el.querySelectorAll('[data-del]'), j;
    for(j = 0; j < eb.length; j++){ (function(b){ b.onclick = function(){ mgAdminPanel(b.getAttribute('data-edit')); }; })(eb[j]); }
    for(j = 0; j < db2.length; j++){
      (function(b){
        b.onclick = async function(){
          var id = b.getAttribute('data-del'), name = '';
          for(var q = 0; q < songs.length; q++){ if(songs[q].id === id) name = songs[q].title; }
          if(!confirm('「' + name + '」を けすよ。もとにもどせないけど いい?')) return;
          var ok = await mgSongDel(id);
          mgAdminPanel(id === editId ? '' : editId, { text: ok ? 'さくじょしたよ' : 'さくじょできなかったよ', err: !ok });
        };
      })(db2[j]);
    }
    document.getElementById('mgAdBack').onclick = mgSongSetup;
    document.getElementById('mgAdPass').onclick = function(){ mgAdminSetPass(true); };
    document.getElementById('mgAdLock').onclick = function(){
      try{ sessionStorage.removeItem(MG_ADMIN_SS); }catch(e){}
      mgSongSetup();
    };
    var nb = document.getElementById('mgAdNew');
    if(nb) nb.onclick = function(){ mgAdminPanel(''); };

    document.getElementById('mgAdSave').onclick = async function(){
      var title = document.getElementById('mgAdTitle').value.replace(/^\s+|\s+$/g, '');
      var lyrics = document.getElementById('mgAdLyrics').value;
      var url = document.getElementById('mgAdUrl').value.replace(/^\s+|\s+$/g, '');
      var fileEl = document.getElementById('mgAdFile');
      var file = (fileEl.files && fileEl.files[0]) ? fileEl.files[0] : null;
      var clearEl = document.getElementById('mgAdClear');
      var clearAudio = !!(clearEl && clearEl.checked);
      if(!title){ err('だいめいを いれてね'); return; }
      var parsed = mgParseCustom(lyrics);
      if(!parsed.lines.length){ err('うてる もじが ないよ。かしを ひらがなで いれてね'); return; }
      if(url && !/^https?:\/\//i.test(url)){ err('URLは https:// から はじめてね'); return; }
      var audioData = null;
      if(file){
        if(file.type && file.type.indexOf('audio/') !== 0){ err('おんがくファイルを えらんでね'); return; }
        if(file.size > MG_AUDIO_MAX){ err('ファイルが おおきすぎるよ(3MBまで)。URLでも いれられるよ'); return; }
        try{ audioData = await mgReadFile(file); }catch(e){ err('ファイルを よみこめなかったよ'); return; }
      }
      var hasAudio = cur ? cur.hasAudio : false, removeAudio = false;
      if(audioData){ hasAudio = true; url = ''; }
      else if(url){ if(hasAudio){ removeAudio = true; } hasAudio = false; }
      else if(clearAudio){ hasAudio = false; removeAudio = true; }
      var rec = { id: cur ? cur.id : ('s' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)),
                  title: title, lyrics: lyrics, audioUrl: url, hasAudio: hasAudio, createdAt: cur ? (cur.createdAt || Date.now()) : Date.now() };
      var btn = document.getElementById('mgAdSave');
      btn.disabled = true;
      var saved = await mgSongPut(rec, audioData, removeAudio);
      if(tok !== mgToken || !mgArea()) return;
      if(!saved){ btn.disabled = false; err('ほぞんできなかったよ。ファイルが おおきいか、つうしんが わるいかも'); return; }
      mgAdminPanel('', { text: '「' + title + '」を ほぞんしたよ(うてる ぎょう: ' + parsed.lines.length + ')', err: false });
    };
  }

  // ---- うたを えらぶ画面 ----
  async function mgSongSetup(){
    mgStop();
    var tok = mgToken;
    var el = mgArea(); if(!el) return;
    el.innerHTML = '<div class="mg-setup-title">🎤 うたタイピング</div><div class="mg-setnote">うたを よみこみちゅう…</div>';
    var songs = await mgSongsLoad();
    if(tok !== mgToken || !mgArea()) return;
    var selId = '';
    try{ selId = localStorage.getItem(MG_SONGSEL_KEY) || ''; }catch(e){}
    function find(id){
      for(var i = 0; i < songs.length; i++){ if(songs[i].id === id) return songs[i]; }
      return null;
    }
    if(!find(selId)) selId = '';
    var adminBtn = '<div style="text-align:center; margin:6px 0 2px;"><button class="mg-adminbtn" id="mgSongAdmin">🔧 かんりしゃせってい</button></div>';

    mgTypeSetup('🎤 うたタイピング', [MG_G_CASE, MG_G_PREF, MG_G_KB], {
      topHtml: function(){
        if(!songs.length){
          return '<div class="mg-setnote">まだ うたが ないよ。したの「かんりしゃせってい」から うたを ついかしてね</div>' + adminBtn;
        }
        var h = '<div class="mg-setnote" style="text-align:left; margin:2px 0;">うたを えらんでね</div><div class="mg-songlist" id="mgSongList">';
        for(var i = 0; i < songs.length; i++){
          var sg = songs[i], b = mgGetBest('song_' + sg.id);
          h += '<button class="mg-songbtn' + (sg.id === selId ? ' on' : '') + '" data-song="' + esc(sg.id) + '">' +
               '<span>' + ((sg.audioUrl || sg.hasAudio) ? '♪ ' : '') + esc(sg.title) + '</span>' +
               '<small>' + (b === null ? '' : 'さいこう ' + b + 'もじ/ふん') + '</small></button>';
        }
        return h + '</div>' + adminBtn;
      },
      afterRender: function(root, rerender){
        var bs = root.querySelectorAll('.mg-songbtn');
        for(var i = 0; i < bs.length; i++){
          (function(b){
            b.onclick = function(){
              var list = document.getElementById('mgSongList');
              var top = list ? list.scrollTop : 0;
              selId = b.getAttribute('data-song');
              try{ localStorage.setItem(MG_SONGSEL_KEY, selId); }catch(e){}
              rerender();
              var l2 = document.getElementById('mgSongList');
              if(l2) l2.scrollTop = top;
            };
          })(bs[i]);
        }
        var ab = document.getElementById('mgSongAdmin');
        if(ab) ab.onclick = mgSongAdmin;
      },
      onStart: async function(s, errEl){
        var song = find(selId);
        if(!song){ if(errEl) errEl.textContent = 'うたを えらんでね'; return; }
        var parsed = mgParseCustom(song.lyrics);
        if(!parsed.lines.length){ if(errEl) errEl.textContent = 'この うたは うてる もじが ないよ。かんりしゃに きいてね'; return; }
        var tok2 = mgToken;
        if(errEl) errEl.textContent = '';
        var src = '';
        if(song.audioUrl){ src = song.audioUrl; }
        else if(song.hasAudio){
          if(errEl) errEl.textContent = 'おんがくを よみこみちゅう…';
          src = (await dbGet('gartic/songAudio/' + song.id)) || '';
        }
        if(tok2 !== mgToken || !mgArea()) return;
        mgPlaySong(s, parsed, song, src);
      }
    });
  }

  function mgLaunchTyping(id){
    var base = [MG_G_KIND, MG_G_LEVEL];
    if(id === 'sushi'){
      mgTypeSetup('🍣 すしタイピング', base.concat([MG_G_CASE, MG_G_PREF]), { best:'sushi', unit:'えん', onStart: mgPlaySushi });
    } else if(id === 'pop'){
      mgTypeSetup('🎈 ポップタイピング', base.concat([MG_G_CASE, MG_G_PREF]), { best:'pop', unit:'てん', onStart: mgPlayPop });
    } else if(id === 'kana'){
      mgTypeSetup('⌨️ ひらがなタイピング', base.concat([MG_G_CASE, MG_G_PREF, MG_G_KB]), { best:'kana', unit:'てん', onStart: mgPlaySchool });
    } else {
      mgSongSetup();
    }
  }

  // --- ゲーム: すしタイピング(寿司打風) ---
  function mgPlaySushi(s){
    var el = mgArea(); if(!el) return;
    var sent = (s.kind === 'sentence');
    var TIME = sent ? 60 : 45;
    var DUR = (s.kind === 'kana') ? 4500 : (sent ? 24000 : 7500);
    var items = mgItems(s.kind, s.level);
    var left = TIME, yen = 0, miss = 0, escaped = 0, typer = null, bornAt = 0, prevIdx = -1;
    el.innerHTML =
      '<div class="mg-tbox' + (s.upper ? ' mg-upper' : '') + '">' +
      mgBarHtml('mgStat1', '0えん', 'のこり ' + TIME + 'びょう') +
      '<div class="mg-belt"><div class="mg-plate" id="mgPlate"><div class="mg-plate-sushi">🍣</div><div class="mg-plate-word" id="mgWord"></div></div></div>' +
      '<div class="mg-target-line" id="mgTarget"></div>' +
      '<div class="mg-yomi" id="mgYomi"></div>' +
      '<div class="mg-roma' + (sent ? ' sm' : '') + '" id="mgRoma"></div>' +
      mgTypeInputHtml() +
      '<div class="mg-msg" id="mgMsg">おさらがにげるまえに ローマじでうとう! (えいすうモードでね)</div>' +
      '</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var plate  = document.getElementById('mgPlate');
    var wordEl = document.getElementById('mgWord');
    var targetEl = document.getElementById('mgTarget');
    var yomiEl = document.getElementById('mgYomi');
    var romaEl = document.getElementById('mgRoma');
    wordEl.style.display = sent ? 'none' : 'block';

    function nextPlate(){
      var idx, tries = 0;
      do { idx = Math.floor(Math.random() * items.length); tries++; } while(idx === prevIdx && tries < 10);
      prevIdx = idx;
      var it = items[idx];
      typer = mgTyper(it[1], s.pref);
      bornAt = Date.now();
      wordEl.textContent = sent ? '' : it[0];
      targetEl.textContent = sent ? it[0] : '';
      yomiEl.textContent = (it[0] !== it[1]) ? it[1] : '';
      romaEl.innerHTML = mgRomaHtml(typer);
      plate.style.left = '100%';
    }
    mgWireTypeInput(function(ch){
      var r = mgTypeFeed(typer, ch);
      if(r === 'miss'){ miss++; msgEl.textContent = 'ミス!'; return; }
      romaEl.innerHTML = mgRomaHtml(typer);
      if(r === 'done'){
        var gain = typer.typed.length * 10;
        yen += gain;
        statEl.textContent = yen + 'えん';
        msgEl.textContent = '+' + gain + 'えん! ごちそうさま!';
        nextPlate();
      }
    });
    mgInterval(function(){
      var p = (Date.now() - bornAt) / DUR;
      if(p >= 1){ escaped++; msgEl.textContent = 'にげられた…'; nextPlate(); return; }
      plate.style.left = (100 - 140 * p) + '%';
    }, 40);
    mgInterval(function(){
      left--;
      timeEl.textContent = 'のこり ' + left + 'びょう';
      if(left <= 0){
        mgFinish('sushi', yen, 'ミス ' + miss + 'かい / にげられた ' + escaped + 'さら',
                 { bestKey: 'sushi_' + s.kind + '_' + s.level, retry: function(){ mgPlaySushi(s); } });
      }
    }, 1000);
    nextPlate();
  }

  // --- ゲーム: ポップタイピング(POPタイピング風) ---
  function mgPlayPop(s){
    var el = mgArea(); if(!el) return;
    var sent = (s.kind === 'sentence');
    var TIME = sent ? 60 : 45;
    var MAXB = sent ? 2 : 5;
    var DUR = (s.kind === 'kana') ? 5000 : (sent ? 22000 : 7000);
    var SPAWN = (s.kind === 'kana') ? 1000 : (sent ? 7000 : 1400);
    var items = mgItems(s.kind, s.level);
    var left = TIME, score = 0, miss = 0, popped = 0, escaped = 0, target = -1;
    var COLORS = ['#FF8A3D','#2BB7A4','#FF6B9D','#8B6FE8','#4C9BE8'];
    var slots = [], i;
    var balloons = '';
    for(i = 0; i < MAXB; i++){
      slots.push(null);
      balloons += '<div class="mg-balloon" id="mgB' + i + '" data-i="' + i + '" style="background:' + COLORS[i] + ';">' +
                    '<span class="mg-bw" id="mgB' + i + 'w"></span><span class="mg-br" id="mgB' + i + 'r"></span>' +
                  '</div>';
    }
    el.innerHTML =
      '<div class="mg-tbox' + (s.upper ? ' mg-upper' : '') + '">' +
      mgBarHtml('mgStat1', '0てん', 'のこり ' + TIME + 'びょう') +
      '<div class="mg-sky' + (sent ? ' wide' : '') + '" id="mgSky">' + balloons + '</div>' +
      mgTypeInputHtml() +
      '<div class="mg-msg" id="mgMsg">ふうせんのことばを うってわろう! (タップでもえらべるよ)</div>' +
      '</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var els = [];
    for(i = 0; i < MAXB; i++){
      els.push({
        box: document.getElementById('mgB' + i),
        w:   document.getElementById('mgB' + i + 'w'),
        r:   document.getElementById('mgB' + i + 'r')
      });
    }
    function paint(idx){
      var sl = slots[idx];
      if(!sl) return;
      els[idx].w.textContent = sl.disp + (sl.disp !== sl.word ? ' (' + sl.word + ')' : '');
      els[idx].r.innerHTML = mgRomaHtml(sl.typer);
    }
    function hide(idx){ slots[idx] = null; els[idx].box.style.display = 'none'; }
    function spawn(){
      var free = -1, used = '', j;
      for(j = 0; j < MAXB; j++){
        if(!slots[j] && free < 0) free = j;
        if(slots[j]) used += mgFirstChars(slots[j].typer);
      }
      if(free < 0) return;
      var it = null, ty = null, tries = 0, clash;
      do {
        it = mgPick(items); ty = mgTyper(it[1], s.pref); tries++;
        var fc = mgFirstChars(ty); clash = false;
        for(j = 0; j < fc.length; j++){ if(used.indexOf(fc.charAt(j)) >= 0) clash = true; }
      } while(clash && tries < 20);
      slots[free] = { disp: it[0], word: it[1], typer: ty, bornAt: Date.now(), x: sent ? 2 + Math.random() * 8 : 3 + Math.random() * 45 };
      els[free].box.style.left = slots[free].x + '%';
      paint(free);
    }
    function pickTarget(idx){ if(idx >= 0 && slots[idx]) target = idx; }
    for(i = 0; i < MAXB; i++){
      (function(idx){
        els[idx].box.onpointerdown = function(){ pickTarget(idx); };
        els[idx].box.onclick = function(){ pickTarget(idx); };
      })(i);
    }

    mgWireTypeInput(function(ch){
      var idx = -1, j;
      if(target >= 0 && slots[target] && mgTypeAccepts(slots[target].typer, ch)){
        idx = target;
      } else {
        var oldest = Infinity;
        for(j = 0; j < MAXB; j++){
          if(j === target || !slots[j]) continue;
          if(mgTypeAccepts(slots[j].typer, ch) && slots[j].bornAt < oldest){ oldest = slots[j].bornAt; idx = j; }
        }
      }
      if(idx < 0){ miss++; msgEl.textContent = 'ミス!'; return; }
      target = idx;
      var r = mgTypeFeed(slots[idx].typer, ch);
      paint(idx);
      if(r === 'done'){
        var gain = slots[idx].typer.typed.length * 10;
        score += gain; popped++;
        statEl.textContent = score + 'てん';
        msgEl.textContent = '+' + gain + 'てん! ぱーん!';
        hide(idx);
        target = -1;
      }
    });

    mgInterval(function(){
      var now = Date.now();
      for(var j = 0; j < MAXB; j++){
        var sl = slots[j], b = els[j].box;
        if(!sl){ b.style.display = 'none'; continue; }
        var p = (now - sl.bornAt) / DUR;
        if(p >= 1){
          escaped++; msgEl.textContent = 'にげられた…';
          if(target === j) target = -1;
          hide(j);
          continue;
        }
        b.style.display = 'block';
        b.style.top = (90 - 112 * p) + '%';
        b.className = 'mg-balloon' + (target === j ? ' lock' : '');
      }
    }, 40);
    mgInterval(spawn, SPAWN);
    mgInterval(function(){
      left--;
      timeEl.textContent = 'のこり ' + left + 'びょう';
      if(left <= 0){
        mgFinish('pop', score, popped + 'こ わったよ / ミス ' + miss + 'かい / にげられた ' + escaped + 'こ',
                 { bestKey: 'pop_' + s.kind + '_' + s.level, retry: function(){ mgPlayPop(s); } });
      }
    }, 1000);
    spawn(); mgTimeout(spawn, 500);
  }

  // --- ゲーム: ひらがなタイピング(スクールタイピングふう) ---
  // がくねんごとに もんだいすうと せいげんじかんが きまっている。
  var MG_SCHOOL_CFG = {
    kana:     [[10, 40],  [12, 45],  [14, 60]],
    word:     [[5, 60],   [10, 80],  [15, 100]],
    sentence: [[3, 90],   [5, 150],  [7, 240]]
  };
  function mgPlaySchool(s){
    var el = mgArea(); if(!el) return;
    var cfg = MG_SCHOOL_CFG[s.kind][Math.max(1, Math.min(3, s.level)) - 1];
    var N = cfg[0], TIME = cfg[1], left = TIME;
    var qs = mgShuffle(mgItems(s.kind, s.level)).slice(0, N);
    N = qs.length;
    var qi = 0, typer = null, good = 0, miss = 0;
    var cls = (s.kind === 'kana') ? ' big' : (s.kind === 'sentence' ? ' small' : '');
    el.innerHTML =
      '<div class="mg-tbox' + (s.upper ? ' mg-upper' : '') + '">' +
      mgBarHtml('mgStat1', 'もんだい 1/' + N, 'のこり ' + TIME + 'びょう') +
      '<div class="mg-qtext' + cls + '" id="mgQ"></div>' +
      '<div class="mg-yomi" id="mgQy"></div>' +
      '<div class="mg-roma' + (s.kind === 'sentence' ? ' sm' : '') + '" id="mgRoma"></div>' +
      (s.kb ? mgKeyboardHtml() : '') +
      mgTypeInputHtml() +
      '<div class="mg-msg" id="mgMsg">でたことばを ローマじでうとう! (えいすうモードでね)</div>' +
      '</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var qEl    = document.getElementById('mgQ');
    var yEl    = document.getElementById('mgQy');
    var romaEl = document.getElementById('mgRoma');
    var kb = mgKb(!!s.kb);

    function show(){
      var it = qs[qi];
      typer = mgTyper(it[1], s.pref);
      qEl.textContent = it[0];
      yEl.textContent = (it[0] !== it[1]) ? it[1] : '';
      romaEl.innerHTML = mgRomaHtml(typer);
      statEl.textContent = 'もんだい ' + (qi + 1) + '/' + N;
      kb.next(mgNextKey(typer));
    }
    function end(allDone){
      var total = good + miss;
      var acc = total ? good / total : 0;
      var score = Math.round(good * 10 * acc) + (allDone ? left * 5 : 0);
      var pct = Math.round(acc * 100);
      var rank = (allDone && pct >= 95) ? 'S' : ((allDone && pct >= 90) ? 'A' : (pct >= 80 ? 'B' : 'C'));
      mgFinish('kana', score,
        'クリア ' + qi + '/' + N + 'もん / せいかくりつ ' + pct + '% / ' + (allDone ? 'のこり ' + left + 'びょう' : 'じかんぎれ') + ' / ランク ' + rank,
        { bestKey: 'kana_' + s.kind + '_' + s.level, retry: function(){ mgPlaySchool(s); } });
    }
    mgWireTypeInput(function(ch){
      var r = mgTypeFeed(typer, ch);
      if(r === 'miss'){ miss++; msgEl.textContent = 'ちがうよ!'; kb.bad(ch); return; }
      good++;
      romaEl.innerHTML = mgRomaHtml(typer);
      if(r === 'done'){
        qi++;
        msgEl.textContent = 'せいかい!';
        if(qi >= N){ end(true); return; }
        show();
      } else {
        kb.next(mgNextKey(typer));
      }
    });
    mgInterval(function(){
      left--;
      timeEl.textContent = 'のこり ' + left + 'びょう';
      if(left <= 0){ end(false); }
    }, 1000);
    show();
  }

  // --- ゲーム: うたタイピング(じぶんで いれた ぶんを うつ) ---
  function mgPlaySong(s, parsed, song, audioSrc){
    var el = mgArea(); if(!el) return;
    if(mgAudio){ try{ mgAudio.pause(); }catch(e){} mgAudio = null; }
    var lines = parsed.lines, N = lines.length;

    el.innerHTML =
      '<div class="mg-tbox' + (s.upper ? ' mg-upper' : '') + '">' +
      (song ? '<div class="mg-setnote" style="margin:0 0 4px;">♪ ' + esc(song.title) + '</div>' : '') +
      mgBarHtml('mgStat1', '1/' + N + 'ぎょう', '0:00') +
      '<div class="mg-qtext small" id="mgQ"></div>' +
      '<div class="mg-yomi" id="mgQy"></div>' +
      '<div class="mg-roma sm" id="mgRoma"></div>' +
      (s.kb ? mgKeyboardHtml() : '') +
      mgTypeInputHtml() +
      '<div class="mg-msg" id="mgMsg">1ぎょうずつ ローマじでうとう! (えいすうモードでね)</div>' +
      (audioSrc ? '<div style="text-align:center; margin-top:6px;"><button class="mg-chip" id="mgAudioBtn">🔇 おんがくを とめる</button></div>' : '') +
      '</div>';
    mgWireBack();
    var statEl = document.getElementById('mgStat1');
    var timeEl = document.getElementById('mgStat2');
    var msgEl  = document.getElementById('mgMsg');
    var qEl    = document.getElementById('mgQ');
    var yEl    = document.getElementById('mgQy');
    var romaEl = document.getElementById('mgRoma');
    var kb = mgKb(!!s.kb);

    // おんがく(あれば ループでながす)
    var audioBtn = document.getElementById('mgAudioBtn');
    if(audioSrc){
      var au = null;
      try{ au = new Audio(audioSrc); au.loop = true; au.volume = 0.7; }catch(e){ au = null; }
      mgAudio = au;
      if(au){
        var syncBtn = function(){ if(audioBtn) audioBtn.textContent = au.paused ? '♪ おんがくを ならす' : '🔇 おんがくを とめる'; };
        au.onplay = syncBtn; au.onpause = syncBtn;
        au.onerror = function(){ if(msgEl) msgEl.textContent = 'おんがくが よみこめなかったよ(ゲームは あそべるよ)'; };
        try{ var pr = au.play(); if(pr && pr.catch){ pr.catch(function(){ syncBtn(); }); } }catch(e){}
        if(audioBtn){
          audioBtn.onmousedown = function(ev){ ev.preventDefault(); };
          audioBtn.onclick = function(){
            if(au.paused){ var p2 = au.play(); if(p2 && p2.catch) p2.catch(function(){}); } else { au.pause(); }
            var inp = document.getElementById('mgTypeInput'); if(inp){ try{ inp.focus(); }catch(e){} }
          };
        }
      }
    }

    function show(){
      typer = mgTyper(lines[qi], s.pref);
      qEl.textContent = lines[qi];
      yEl.textContent = (qi + 1 < N) ? 'つぎ: ' + lines[qi + 1] : 'これが さいごの ぎょうだよ!';
      romaEl.innerHTML = mgRomaHtml(typer);
      statEl.textContent = (qi + 1) + '/' + N + 'ぎょう';
      kb.next(mgNextKey(typer));
    }
    function elapsedSec(){ return Math.max(1, Math.floor((Date.now() - startAt) / 1000)); }
    function end(){
      var sec = elapsedSec();
      var total = good + miss;
      var pct = total ? Math.round(good / total * 100) : 0;
      var perMin = Math.round(kana / (sec / 60));
      mgFinish('song', perMin,
        N + 'ぎょう / ' + Math.floor(sec / 60) + 'ふん' + (sec % 60) + 'びょう / せいかくりつ ' + pct + '% / ミス ' + miss + 'かい',
        { bestKey: 'song_' + (song ? song.id : 'custom'), retry: function(){ mgPlaySong(s, parsed, song, audioSrc); } });
    }
    mgWireTypeInput(function(ch){
      var r = mgTypeFeed(typer, ch);
      if(r === 'miss'){ miss++; msgEl.textContent = 'ちがうよ!'; kb.bad(ch); return; }
      good++;
      romaEl.innerHTML = mgRomaHtml(typer);
      if(r === 'done'){
        kana += lines[qi].replace(/[\s\u3000、。，．,.!?！？・「」『』()（）…~〜]/g, '').length;
        qi++;
        msgEl.textContent = 'いいね!';
        if(qi >= N){ end(); return; }
        show();
      } else {
        kb.next(mgNextKey(typer));
      }
    });
    mgInterval(function(){
      var sec = elapsedSec();
      timeEl.textContent = Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
    }, 500);
    show();
  }

  // ---------- 追加ミニゲーム(パズル・すいり) ----------
  var mgKeyFn = null, mgKeyBound = false;
  function mgSetKeys(fn){
    mgKeyFn = fn;
    if(!mgKeyBound){
      mgKeyBound = true;
      document.addEventListener('keydown', function(e){
        if(!mgKeyFn || !mgArea()) return;
